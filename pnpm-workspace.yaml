packages:
  - e2e/*
  - core/*
  - sdk/*
  - cli/*
  - shared/*
  - plugins/*/*
  - '!plugins/fixtures/*'
  - services/*/*
  - adapters/*
  - infra/devkit
  - studio/*
  - sites/*
  - sites/*/apps/*
  - sites/*/packages/*
  - templates/*
  - templates/*/packages/*
  - .kb/plugins/*/packages/*

auditConfig:
  ignoreCves:
    - CVE-2026-14257

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true

overrides:
  react: ^19.0.0
  react-dom: ^19.0.0
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  zod: ^3.25.76
  '@fastify/reply-from': '>=12.6.2'
  '@fastify/static': '>=10.1.1'
  follow-redirects: '>=1.16.0'
  hono: '>=4.12.34'
  '@hono/node-server': '>=2.0.5'
  koa: '>=2.16.4'
  webpack-dev-server: 5.2.6
  ws: '>=8.21.0'
  'fast-uri@>=4.0.0 <4.1.2': '>=4.1.2'
  'fast-uri@>=3.0.0 <3.1.6': '>=3.1.6'
  shell-quote: '>=1.9.0'
  browserslist: '>=4.28.7'
  fflate: '>=0.8.3'
  '@humanfs/node': '>=0.16.8'
  react-router: '>=7.18.1'
  react-router-dom: '>=7.18.1'
  postcss: '>=8.5.23'
  'nanoid@<3.3.18': '>=3.3.18'
  ip-address: '>=10.3.1'
  uuid: '>=11.1.1'
  qs: '>=6.15.4'
  sharp: '>=0.35.0'
  find-my-way: '>=9.7.0'
  # gray-matter's yaml engine calls the safeLoad/safeDump aliases removed in js-yaml 4;
  # keep it on the patched 3.x line and only force 4.x elsewhere (e.g. eslint).
  'gray-matter>js-yaml': '>=3.15.1 <4'
  js-yaml: '^4.3.1'
  'brace-expansion@^5.0.5': '5.0.9'
  'brace-expansion@^2.0.2': '2.1.4'
  'brace-expansion@^1.1.7': '1.1.18'
  'minimatch@3.1.5>brace-expansion': '1.1.18'
  'minimatch@9.0.9>brace-expansion': '2.1.4'
  'minimatch@10.2.5>brace-expansion': '5.0.9'
  '@babel/core': '>=7.29.6'
  'body-parser@>=2.0.0 <2.3.0': '>=2.3.0'
  'tar@<=7.5.18': '>=7.5.19'
  'axios@<1.18.0': '>=1.18.0'
  esbuild: ^0.28.1
  'undici@^7.0.0': '7.29.0'
  'undici@7.24.7': '7.29.0'
  'undici@7.28.0': '7.29.0'
  'undici@^6.23.0': '6.28.0'
  'undici@<6.28.0': '6.28.0'
  '@qdrant/js-client-rest>undici': '6.28.0'
  'nodemailer@<=9.0.0': '>=9.0.1'
  launch-editor: '>=2.14.1'
  'http-proxy-middleware@>=0.16.0 <2.0.10': 2.0.10
  'form-data@>=4.0.0 <4.0.6': '>=4.0.6'
  'adm-zip@<0.6.0': '>=0.6.0'
