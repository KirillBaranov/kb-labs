name: Release — deliver immutable candidate

# Delivery accepts only a bundle produced by release-build-candidate.yml. It
# does not build, stage, version or resolve anything. The workflow engine
# supplies the candidate run and target after its own approval transition.

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: GitHub Actions run that produced the candidate bundle
        required: true
        type: string
      candidate_id:
        description: Candidate identifier to verify against provenance
        required: true
        type: string
      flow:
        description: Release flow in the bundle
        required: true
        type: choice
        options: [platform, sdk]
      version:
        description: Exact release version in the bundle
        required: true
        type: string
      target:
        description: Delivery target selected by the workflow engine
        required: true
        type: choice
        options: [canary, stable]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-delivery-${{ inputs.candidate_id }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deliver:
    name: Deliver ${{ inputs.candidate_id }} to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # The full workspace build includes tools that require Go 1.25;
          # do not let the kb-devkit module's Go 1.22 directive downgrade it.
          go-version: '1.25'
          cache: false

      - name: Build kb-devkit
        run: go build -o kb-devkit .
        working-directory: tools/kb-devkit

      - name: Download candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: release-candidate-${{ inputs.candidate_id }}
          path: .kb/release/bundle

      - name: Verify candidate identity and bundle digest
        env:
          EXPECTED_ID: ${{ inputs.candidate_id }}
          EXPECTED_FLOW: ${{ inputs.flow }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -s .kb/release/bundle/provenance.json
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const p = JSON.parse(fs.readFileSync('.kb/release/bundle/provenance.json', 'utf8'));
          for (const [key, expected] of [['candidateId', process.env.EXPECTED_ID], ['flow', process.env.EXPECTED_FLOW], ['version', process.env.EXPECTED_VERSION]]) {
            if (p[key] !== expected) throw new Error(`candidate ${key} mismatch: ${p[key]} != ${expected}`);
          }
          const lines = fs.readFileSync('.kb/release/bundle/bundle.sha256', 'utf8').trim().split(/\r?\n/).filter(Boolean);
          for (const line of lines) {
            const match = line.match(/^([a-f0-9]{64})  (.+)$/);
            if (!match) throw new Error(`invalid bundle checksum line: ${line}`);
            // Candidates built before bundle.sha256 was excluded include a
            // self-referential entry, which cannot be validated after write.
            if (match[2] === './bundle.sha256') continue;
            const actual = crypto.createHash('sha256').update(fs.readFileSync(`.kb/release/bundle/${match[2]}`)).digest('hex');
            if (actual !== match[1]) throw new Error(`bundle checksum mismatch: ${match[2]}`);
          }
          NODE

      - name: Install delivery tooling
        run: pnpm install --frozen-lockfile

      - name: Build platform tooling
        run: ./tools/kb-devkit/kb-devkit run build --no-cache

      - name: Deliver exact npm tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARGET: ${{ inputs.target }}
          FLOW: ${{ inputs.flow }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pnpm kb release deliver \
            --flow "$FLOW" \
            --release-tag "${FLOW}-v${VERSION}" \
            --artifacts-dir .kb/release/bundle/npm \
            --target npm \
            --tag "$TARGET" \
            --json

      - name: Deliver exact binary assets
        if: inputs.flow == 'platform'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s .kb/release/bundle/binary-manifest.json
          binary_tag="v${VERSION}-binaries"
          rm -rf .kb/release/upload-assets
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const sourceDir = '.kb/release/bundle/binaries';
          const outputDir = '.kb/release/upload-assets';
          const manifest = JSON.parse(fs.readFileSync('.kb/release/bundle/binary-manifest.json', 'utf8'));
          const byDigest = new Map(manifest.binaries.map((asset) => [asset.sha256, asset.filename]));
          const matched = new Set();
          fs.mkdirSync(outputDir, { recursive: true });
          for (const entry of fs.readdirSync(sourceDir, { recursive: true, withFileTypes: true })) {
            if (!entry.isFile()) continue;
            const source = path.join(entry.parentPath, entry.name);
            const digest = crypto.createHash('sha256').update(fs.readFileSync(source)).digest('hex');
            const filename = byDigest.get(digest);
            if (!filename) continue;
            fs.copyFileSync(source, path.join(outputDir, filename));
            matched.add(filename);
          }
          if (matched.size !== manifest.binaries.length) {
            throw new Error(`prepared ${matched.size}/${manifest.binaries.length} binary assets`);
          }
          fs.copyFileSync(path.join(sourceDir, 'checksums.txt'), path.join(outputDir, 'checksums.txt'));
          NODE
          mapfile -t assets < <(find .kb/release/upload-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 0
          if gh release view "$binary_tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$binary_tag" "${assets[@]}" --repo "$REPOSITORY" --clobber
          else
            gh release create "$binary_tag" "${assets[@]}" --repo "$REPOSITORY" --title "KB Labs Binaries $binary_tag" --notes "Immutable release candidate ${{ inputs.candidate_id }}"
          fi
          jq -n --arg tag "$binary_tag" --arg channel "$TARGET" --arg candidate "${{ inputs.candidate_id }}" \
            '{schema: 2, channel: $channel, tag: $tag, candidateId: $candidate}' > channel.json
          channel_release="binaries-${TARGET}"
          if gh release view "$channel_release" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$channel_release" channel.json --repo "$REPOSITORY" --clobber
          else
            gh release create "$channel_release" channel.json --repo "$REPOSITORY" --title "KB Labs binaries $TARGET channel" --notes "Managed by the release workflow engine."
          fi

      - name: Run post-publish launcher smoke
        if: inputs.flow == 'platform'
        working-directory: tools/kb-create
        env:
          KB_CREATE_RELEASE_INDEX: ${{ github.workspace }}/.kb/release/bundle/release-index.json
          KB_CREATE_PACKAGE_TAG: ${{ inputs.target }}
        run: |
          set -euo pipefail
          binary="${{ github.workspace }}/.kb/release/upload-assets/kb-create-linux-amd64"
          test -x "$binary"
          KB_CREATE_BINARY="$binary" go test -v -race -count=1 -timeout 12m \
            -run '^TestPublishedV2JourneyReachesPluginWorkflow$' ./v2/e2e/...
