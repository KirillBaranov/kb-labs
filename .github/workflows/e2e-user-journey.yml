name: Post-publish User Journey Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
  workflow_run:
    workflows: [Release Binaries, Publish npm (on release tag)]
    types: [completed]

permissions:
  contents: read

jobs:
  user-journey:
    name: Published user journey
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build clean user-journey image
        run: docker build -t kb-e2e-user-journey -f e2e/install-flow/Dockerfile e2e/install-flow

      - name: Run install-to-first-value journey
        run: |
          set -o pipefail
          docker run --rm kb-e2e-user-journey 2>&1 | tee /tmp/kb-user-journey.log
          exit "${PIPESTATUS[0]}"

      - name: Upload journey log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: user-journey-logs-${{ github.run_id }}
          path: /tmp/kb-user-journey.log
          if-no-files-found: ignore
