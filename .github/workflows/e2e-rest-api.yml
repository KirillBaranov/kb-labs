name: E2E REST API Tests

# Focused suite for plugins/rest-api (:5050) e2e coverage.
# Uses the shared reusable-e2e-docker workflow for the full
# build → Verdaccio → platform → test pipeline.
#
# Triggers:
# - After every CI run on main (post-merge validation)
# - Manual dispatch

on:
  workflow_call:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-rest-api-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E REST API
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/reusable-e2e-docker.yml
    with:
      suite: rest-api
      e2e-package: "@kb-labs/e2e-rest-api"
      health-url: http://localhost:5050/api/v1/health
      health-steps: 36
      playwright-dir: e2e/rest-api
      compose-project: kb-e2e-rest-api
    permissions:
      contents: read
