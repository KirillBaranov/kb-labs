name: Affected E2E

# The fast PR gate completes first. This workflow then runs only the E2E zones
# selected from the same complete PR diff. `workflow_run` is deliberately used
# instead of a `pull_request` dependency so Docker/browser work cannot extend
# the author feedback loop.
on:
  workflow_run:
    workflows: [CI (PR)]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to evaluate
        required: true
        type: string
  # Allows validating a newly introduced selector before this workflow reaches
  # the default branch. It is also a useful maintainer escape hatch later.
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  discover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0].number != '') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-test'))
    runs-on: ubuntu-latest
    outputs:
      generic: ${{ steps.matrix.outputs.generic }}
      has-auth: ${{ steps.matrix.outputs.has-auth }}
      pr-number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Resolve pull request refs
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          INPUT_PR: ${{ inputs.pr-number }}
          WORKFLOW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        with:
          script: |
            const number = process.env.INPUT_PR || process.env.WORKFLOW_PR || process.env.EVENT_PR;
            if (!number) core.setFailed('Affected E2E requires a pull request run.');
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(number),
            });
            core.setOutput('number', String(pr.number));
            core.setOutput('base', pr.base.ref);
            core.setOutput('head', pr.head.sha);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
      - name: Resolve affected E2E zones
        env:
          KB_DEVKIT_BASE_REF: origin/${{ steps.pr.outputs.base }}...HEAD
        run: |
          mkdir -p .ci
          node scripts/ci/resolve-e2e-zones.mjs \
            --base-ref "$KB_DEVKIT_BASE_REF" \
            --output .ci/e2e-test-plan.json \
            --markdown .ci/e2e-test-plan.md
          cat .ci/e2e-test-plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create runner matrix
        id: matrix
        run: |
          generic=$(node -e '
            const plan = require("./.ci/e2e-test-plan.json");
            const suites = [...new Set(plan.selected
              .filter((zone) => zone.runner === "docker")
              .flatMap((zone) => zone.suites)
              .filter((suite) => !["e2e-auth", "e2e-oauth"].includes(suite))
              .map((suite) => suite.replace(/^e2e-/, "")))];
            process.stdout.write(JSON.stringify(suites));
          ')
          auth=$(node -e '
            const plan = require("./.ci/e2e-test-plan.json");
            process.stdout.write(String(plan.selected.some((zone) => zone.suites.includes("e2e-auth"))));
          ')
          echo "generic=$generic" >> "$GITHUB_OUTPUT"
          echo "has-auth=$auth" >> "$GITHUB_OUTPUT"

  docker-e2e:
    needs: discover
    if: needs.discover.outputs.generic != '[]'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover.outputs.generic) }}
    uses: ./.github/workflows/reusable-e2e-docker.yml
    with:
      suite: ${{ matrix.suite }}
      e2e-package: "@kb-labs/e2e-${{ matrix.suite }}"
      health-url: http://localhost:4000/ready
      health-steps: 60
      playwright-dir: e2e/plugins
      compose-project: kb-e2e-affected-${{ matrix.suite }}
      artifact-prefix: affected
    permissions:
      contents: read

  auth-e2e:
    needs: discover
    if: needs.discover.outputs.has-auth == 'true'
    uses: ./.github/workflows/reusable-e2e-playwright.yml
    with:
      suite: auth
      compose-files: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.auth-ci.yml
      compose-project: kb-e2e-affected-auth
      run-command: cd e2e/auth && pnpm e2e
      report-dir: e2e/auth/report
      artifact-prefix: affected-auth
      studio: true
      studio-https: false
      idp: false
    permissions:
      contents: read

  oauth-e2e:
    needs: discover
    if: needs.discover.outputs.has-auth == 'true'
    uses: ./.github/workflows/reusable-e2e-playwright.yml
    with:
      suite: oauth
      compose-files: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.auth-ci.yml:e2e/docker-compose.oauth-ci.yml
      compose-project: kb-e2e-affected-oauth
      run-command: cd e2e/auth && pnpm e2e:oauth
      report-dir: e2e/auth/report-oauth
      artifact-prefix: affected-oauth
      studio: true
      studio-https: true
      idp: true
      hosts-entry: "127.0.0.1 kb-cloud.kblabs.ru"
    permissions:
      contents: read

  evidence:
    name: CI evidence
    needs: [discover, docker-e2e, auth-e2e, oauth-e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Summarize every failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-evidence-summary.mjs --output ci-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-evidence-${{ github.run_id }}
          path: ci-evidence.json
          retention-days: 30
