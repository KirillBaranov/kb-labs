# KB Labs platform — declarative deploy to the single VM via `kb-deploy apply`.
#
# This is the dogfood of ADR-0014 (TD-13): build the monorepo, publish every
# @kb-labs/* package to a private Verdaccio running ON the target VM, then run
# `kb-deploy apply` which installs + swaps + restarts the four core daemons over
# SSH and gates each on its health probe.
#
# Decoupled from public npm release: packages are served from the VM's own
# Verdaccio (@kb-labs/* local-only, everything else proxies npmjs), so a deploy
# never depends on what is published to registry.npmjs.org.
#
# Manual trigger only. dry_run defaults to true — flip to false to actually
# mutate the host.
name: Deploy Platform (apply)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Platform package version to deploy (must exist in the build).
        default: "2.94.0"
        type: string
      dry_run:
        description: Compute the plan but do not mutate the host.
        default: true
        type: boolean
      reset_platform:
        description: >-
          Wipe installed releases/services/devservices before apply. Release ids
          are spec-derived, so install-service NoOps on an existing release dir
          even when the package content changed — use this once to clear state
          left by an earlier broken build, then deploy normally.
        default: false
        type: boolean

concurrency:
  group: deploy-platform
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub environment gate — add required reviewers in repo settings to make
    # a real (dry_run=false) apply require approval.
    environment: production
    env:
      MANIFEST: .kb/deploy/deploy.yaml
      PLATFORM_PATH: /home/deploy/kb-platform
      REGISTRY: http://127.0.0.1:4873
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ── Toolchain ──────────────────────────────────────────────────────────
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25"
          cache-dependency-path: |
            tools/clikit/go.sum
            tools/kb-deploy/go.sum
            tools/kb-create/go.sum
            tools/kb-dev/go.sum
            tools/kb-devkit/go.sum

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      # ── Build monorepo (topological) ─────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build kb-devkit
        run: make build
        working-directory: tools/kb-devkit

      - name: Build all packages
        run: ./tools/kb-devkit/kb-devkit run build

      # ── Build Go binaries ────────────────────────────────────────────────────
      # Runner is linux/amd64 == target arch, so a native build is also the host
      # binary. kb-deploy runs on the runner; kb-create + kb-dev run on the VM.
      - name: Build kb-deploy / kb-create / kb-dev
        run: |
          make -C tools/kb-deploy build
          make -C tools/kb-create build
          make -C tools/kb-dev    build

      # ── Pack every publishable @kb-labs/* package ────────────────────────────
      - name: Pack packages
        run: bash e2e/scripts/pack-all.sh

      # ── SSH key for rsync/ssh helper steps (apply reads SSH_KEY env directly) ─
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy.key
          chmod 600 ~/.ssh/deploy.key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── Reclaim disk (+ optional reset) BEFORE any host write ────────────────
      # Repeated deploys fill the small VM disk (per-release node_modules, caches,
      # dangling docker layers + volumes, old releases) until even `scp` of a
      # binary fails with ENOSPC and MongoDB crashes. Free space here, before
      # Bootstrap touches the host, then HARD-FAIL if still below the floor so the
      # run aborts cleanly instead of hanging mid-install.
      - name: Reclaim disk
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSHOPTS="-i $HOME/.ssh/deploy.key -o StrictHostKeyChecking=accept-new"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" "RESET='${{ inputs.reset_platform }}' bash -s" <<'REMOTE'
          set -uo pipefail
          P="$HOME/kb-platform"
          STORE="$P/.kb/pnpm-store"
          MIN_FREE_KB=$((3 * 1024 * 1024))   # 3 GiB floor (matches kb-create's guard headroom)
          echo "Disk before:"; df -h "$HOME" | tail -1

          if [ "${RESET:-}" = "true" ]; then
            command -v kb-dev >/dev/null && kb-dev --config "$P/.kb/devservices.yaml" stop 2>/dev/null || true
            echo "reset_platform: removing installed releases / services / registry…"
            rm -rf "$P/releases" "$P/services" "$P/releases.json" "$P/.kb/devservices.yaml"
          fi

          # Do NOT prune the shared pnpm store ($STORE): keeping it warm across
          # deploys lets pnpm hardlink already-durable store objects instead of
          # cold-writing them, which avoids the transient manifest.json corruption
          # (null bytes / truncation) seen when reading a just-written object. The
          # store is small (deduped ~hundreds of MB), so warm-keeping costs little.
          # Prune only the default per-user store + npm caches.
          : "$STORE" # referenced for clarity; intentionally not pruned
          pnpm store prune 2>/dev/null || true
          rm -rf "$HOME/.cache/pnpm" "$HOME/.npm/_cacache" 2>/dev/null || true
          npm cache clean --force 2>/dev/null || true
          # Dangling docker volumes (old gateway/redis/analytics stacks) were the
          # single largest reclaim in practice (~2.4 GiB). Only volumes not attached
          # to any container are removed, so live infra is untouched.
          docker image prune -af 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true

          echo "Disk after:"; df -h "$HOME" | tail -1
          FREE_KB=$(df -P "$HOME" | tail -1 | awk '{print $4}')
          if [ "$FREE_KB" -lt "$MIN_FREE_KB" ]; then
            echo "::error::Only $((FREE_KB/1024)) MiB free after reclaim; need >= $((MIN_FREE_KB/1024)) MiB. Free space or run with reset_platform=true."
            exit 1
          fi
          REMOTE

      # ── Bootstrap the host: kb-create + kb-dev binaries, Verdaccio ───────────
      # Idempotent: re-running just overwrites binaries and leaves Verdaccio up.
      - name: Bootstrap host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSHOPTS="-i $HOME/.ssh/deploy.key -o StrictHostKeyChecking=accept-new"
          scp $SSHOPTS tools/kb-create/kb-create tools/kb-dev/kb-dev "$SSH_USER@$SSH_HOST:/tmp/"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo install -m 0755 /tmp/kb-create /usr/local/bin/kb-create
          sudo install -m 0755 /tmp/kb-dev    /usr/local/bin/kb-dev
          rm -f /tmp/kb-create /tmp/kb-dev
          command -v node >/dev/null || { echo "::error::node missing on host"; exit 1; }
          # pnpm is required for the shared-store install path (kb-create falls
          # back to npm without it, which copies node_modules per release and
          # fills the disk). Provision it via corepack.
          # Keep the deployment host on the same supported toolchain as the
          # platform installer.
          if ! command -v pnpm >/dev/null; then
            echo "pnpm missing — provisioning pnpm@11 via corepack"
            sudo corepack enable pnpm 2>/dev/null || true
            corepack prepare pnpm@11.4.0 --activate 2>/dev/null \
              || sudo npm install -g pnpm@11.4.0 2>/dev/null \
              || { echo "::error::failed to install pnpm on host"; exit 1; }
          fi
          echo "pnpm: $(pnpm --version 2>&1 | head -1)"
          # Verdaccio config: htpasswd lives under the writable storage volume
          # (the image's default /verdaccio/conf is not writable by uid 10001, which
          # makes adduser fail with HTTP 500). @kb-labs/* is local-only; everything
          # else proxies npmjs.
          mkdir -p ~/kb-verdaccio
          cat > ~/kb-verdaccio/config.yaml <<'VCFG'
          storage: /verdaccio/storage/data
          auth:
            htpasswd:
              file: /verdaccio/storage/htpasswd
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
          packages:
            '@kb-labs/*':
              access: $all
              publish: $authenticated
              unpublish: $authenticated
            '@*/*':
              access: $all
              publish: $authenticated
              proxy: npmjs
            '**':
              access: $all
              publish: $authenticated
              proxy: npmjs
          log: { type: stdout, format: pretty, level: warn }
          VCFG
          # Always recreate with EPHEMERAL storage (no named volume): every run
          # starts with an empty registry so the freshly-built @kb-labs/* tarballs
          # are what gets served. A persistent volume would keep the previous
          # 2.94.0 tarball, npm publish would 409 ("already published") and skip,
          # and install-service would resolve the stale build (missing the just
          # added dist/manifest.json) — the exact bug this avoids. Re-proxying npmjs
          # deps each run is a cheap price for guaranteed freshness.
          docker rm -f kb-verdaccio 2>/dev/null || true
          docker run -d --name kb-verdaccio --restart unless-stopped \
            -p 127.0.0.1:4873:4873 \
            -v ~/kb-verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro \
            verdaccio/verdaccio:latest
          ok=0
          for i in $(seq 1 30); do
            curl -sf -m 5 http://127.0.0.1:4873/-/ping >/dev/null && { ok=1; break; } || sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::Verdaccio did not come up"; docker logs --tail 50 kb-verdaccio || true; exit 1; }
          echo "kb-create: $(kb-create --version 2>&1 | head -1)"
          echo "kb-dev:    $(kb-dev --version 2>&1 | head -1)"
          REMOTE

      # ── Publish all tarballs to the VM's Verdaccio (@kb-labs/* local-only) ───
      - name: Publish packages to Verdaccio
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSHOPTS="-i $HOME/.ssh/deploy.key -o StrictHostKeyChecking=accept-new"
          rsync -az --delete -e "ssh $SSHOPTS" e2e/packages/ "$SSH_USER@$SSH_HOST:~/kb-packages/"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          # Verdaccio's default policy is publish:$authenticated. Ensure a local user
          # exists in htpasswd, then authenticate publishes with HTTP Basic — this is
          # idempotent across runs (the adduser PUT returns 409 once the user is
          # persisted in the named volume, whereas Basic auth keeps working). The
          # registry is loopback-only on the VM, so a local CI credential is acceptable.
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          code=$(curl -s -o /dev/null -w '%{http_code}' -XPUT \
            -H 'Content-Type: application/json' \
            -d "{\"_id\":\"org.couchdb.user:kb-ci\",\"name\":\"kb-ci\",\"password\":\"kb-ci-local\",\"type\":\"user\",\"roles\":[],\"date\":\"$NOW\"}" \
            "http://127.0.0.1:4873/-/user/org.couchdb.user:kb-ci")
          # 201 created (first run) or 409 already-registered (later runs) are both fine.
          case "$code" in
            200|201|409) echo "Verdaccio user ready (HTTP $code)";;
            *) echo "::error::Verdaccio adduser failed (HTTP $code)"; exit 1;;
          esac
          AUTH=$(printf '%s' 'kb-ci:kb-ci-local' | base64 | tr -d '\n')
          npm config set //127.0.0.1:4873/:_auth "$AUTH"
          npm config set //127.0.0.1:4873/:always-auth true
          published=0; skipped=0; failed=0
          for f in ~/kb-packages/*.tgz; do
            out=$(npm publish "$f" --registry http://127.0.0.1:4873 2>&1) && { published=$((published+1)); continue; }
            # Already published (409 / EPUBLISHCONFLICT) is a benign idempotent skip.
            if echo "$out" | grep -qiE 'already|conflict|409|cannot publish over'; then
              skipped=$((skipped+1))
            else
              failed=$((failed+1)); echo "FAILED $f: $out"
            fi
          done
          echo "publish: $published published, $skipped skipped, $failed failed"
          test "$failed" -eq 0
          REMOTE


      # ── Apply ────────────────────────────────────────────────────────────────
      - name: kb-deploy apply
        env:
          # SSH coordinates (deploy.yaml interpolates ${SSH_HOST}/${SSH_USER} and
          # reads the PEM from SSH_KEY via key_env).
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          # ${secrets.X} in deploy.yaml resolve against these env vars (env backend).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROXY_URL: ${{ secrets.OPENAI_PROXY_URL }}
          GATEWAY_JWT_SECRET: ${{ secrets.GATEWAY_JWT_SECRET }}
          GATEWAY_INTERNAL_SECRET: ${{ secrets.GATEWAY_INTERNAL_SECRET }}
        run: |
          FLAGS="--config $MANIFEST --yes"
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          ./tools/kb-deploy/kb-deploy apply $FLAGS

      # ── Smoke test the daemons (skipped on dry-run) ──────────────────────────
      - name: Smoke /health
        if: ${{ inputs.dry_run == false }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSHOPTS="-i $HOME/.ssh/deploy.key -o StrictHostKeyChecking=accept-new"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          check() { curl -sf -m 10 "$2" >/dev/null && echo "$1: OK" || { echo "::error::$1 health failed ($2)"; return 1; }; }
          rc=0
          check rest     http://127.0.0.1:5050/api/v1/health || rc=1
          check workflow http://127.0.0.1:7778/health || rc=1
          check gateway  http://127.0.0.1:4000/health || rc=1
          check studio   http://127.0.0.1:3002/health || rc=1
          exit $rc
          REMOTE

      # ── Diagnose daemons when something failed ───────────────────────────────
      # Read-only: dumps kb-dev status, per-service logs and listening ports so a
      # failed apply / health gate is diagnosable without a manual SSH session.
      - name: Diagnose daemons
        if: failure()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSHOPTS="-i $HOME/.ssh/deploy.key -o StrictHostKeyChecking=accept-new"
          ssh $SSHOPTS "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          CFG="$HOME/kb-platform/.kb/devservices.yaml"
          echo "===== kb-dev status ====="
          kb-dev --config "$CFG" status 2>&1 || true
          for s in rest-api-app workflow-daemon gateway-app studio-app; do
            echo "===== logs: $s (last 120) ====="
            kb-dev --config "$CFG" logs "$s" -n 120 2>&1 || true
          done
          echo "===== listening ports ====="
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':(7777|5050|7778|4000)\b' || echo "(no platform ports listening)"
          echo "===== releases / current symlinks ====="
          ls -la "$HOME/kb-platform/services/"*/current 2>&1 || true
          echo "===== delivered config (placeholders, not resolved) ====="
          sed -E 's/(secret|key|token|password)/\1/I' "$HOME/kb-platform/.kb/kb.config.jsonc" 2>&1 | head -80 || true
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy.key
