name: Release Binaries

# Builds and publishes all KB Labs Go binaries (kb-create, kb-dev, kb-devkit,
# kb-deploy, kb-monitor) as a single, immutable GitHub Release, then points
# the mutable `binaries-canary` channel at it — mirroring the npm flow, where
# every tag push lands on canary first and promote-binaries.yml is the only
# path to stable.
#
# Tag format: v<MAJOR>.<MINOR>.<PATCH>-binaries (e.g. v0.4.0-binaries).
# Valid semver (prerelease suffix) — goreleaser accepts it. The release is
# still marked as non-prerelease (see .goreleaser.yaml), while consumers select
# this stream by its -binaries suffix. Suffix distinguishes it from npm release
# tags (platform-vX.Y.Z and sdk-vX.Y.Z).

on:
  push:
    tags:
      - 'v*-binaries'
  workflow_dispatch:

permissions:
  contents: write   # create release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25'
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The public bootstrap scripts read this direct release asset instead of
      # listing releases through api.github.com. Updating this pointer is a
      # release-time operation and makes rollback a single asset replacement.
      #
      # Every tag push lands on canary first — promote-binaries.yml is the
      # only path that moves a specific tag to the `binaries-stable` pointer.
      - name: Publish canary binaries channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          jq -n --arg tag "$RELEASE_TAG" --arg commit "$commit" \
            '{schema: 1, channel: "canary", tag: $tag, commit: $commit}' > channel.json
          if ! gh release view binaries-canary --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create binaries-canary --repo "$REPOSITORY" --title "KB Labs binaries canary channel" --notes "Mutable canary channel pointer for bootstrap installers."
          fi
          gh release upload binaries-canary channel.json --repo "$REPOSITORY" --clobber
