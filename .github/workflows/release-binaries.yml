name: Release Binaries

# Builds and publishes all KB Labs Go binaries (kb-create, kb-dev, kb-devkit,
# kb-deploy, kb-monitor) as a single GitHub Release.
#
# Tag format: v<MAJOR>.<MINOR>.<PATCH>-binaries (e.g. v0.4.0-binaries).
# Valid semver (prerelease suffix) — goreleaser accepts it. The release is
# still marked as non-prerelease (see .goreleaser.yaml), while consumers select
# this stream by its -binaries suffix. Suffix distinguishes it from npm release
# tags (platform-vX.Y.Z and sdk-vX.Y.Z).

on:
  push:
    tags:
      - 'v*-binaries'
  workflow_dispatch:

permissions:
  contents: write   # create release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The public bootstrap scripts read this direct release asset instead of
      # listing releases through api.github.com. Updating this pointer is a
      # release-time operation and makes rollback a single asset replacement.
      - name: Publish stable binaries channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -n --arg tag "$RELEASE_TAG" '{schema: 1, channel: "stable", tag: $tag}' > channel.json
          if ! gh release view binaries-stable --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create binaries-stable --repo "$REPOSITORY" --title "KB Labs binaries stable channel" --notes "Mutable stable channel pointer for bootstrap installers."
          fi
          gh release upload binaries-stable channel.json --repo "$REPOSITORY" --clobber
