name: Release Binaries

# Builds and publishes all KB Labs Go binaries (kb-create, kb-dev, kb-devkit,
# kb-deploy, kb-monitor) as a single, immutable GitHub Release, then points
# the mutable `binaries-canary` channel at it — mirroring the npm flow, where
# every tag push lands on canary first and promote-binaries.yml is the only
# path to stable.
#
# Tag format: v<MAJOR>.<MINOR>.<PATCH>-binaries (e.g. v0.4.0-binaries).
# Valid semver (prerelease suffix) — goreleaser accepts it. The release is
# still marked as non-prerelease (see .goreleaser.yaml), while consumers select
# this stream by its -binaries suffix. Suffix distinguishes it from npm release
# tags (platform-vX.Y.Z and sdk-vX.Y.Z).

on:
  push:
    tags:
      - 'v*-binaries'
  workflow_dispatch:

permissions:
  contents: write   # create release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25'
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The public bootstrap scripts read this direct release asset instead of
      # listing releases through api.github.com. Updating this pointer is a
      # release-time operation and makes rollback a single asset replacement.
      #
      # Every tag push lands on canary first — promote-binaries.yml is the
      # only path that moves a specific tag to the `binaries-stable` pointer.
      - name: Publish canary binaries channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          jq -n --arg tag "$RELEASE_TAG" --arg commit "$commit" \
            '{schema: 1, channel: "canary", tag: $tag, commit: $commit}' > channel.json
          if ! gh release view binaries-canary --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create binaries-canary --repo "$REPOSITORY" --title "KB Labs binaries canary channel" --notes "Mutable canary channel pointer for bootstrap installers."
          fi
          gh release upload binaries-canary channel.json --repo "$REPOSITORY" --clobber

  binary-post-publish-smoke:
    name: kb-create binary post-publish smoke
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/kb-create/go.mod
          cache-dependency-path: tools/kb-create/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Use candidate release-index
        run: |
          set -euo pipefail
          test -s .kb/release/release-index.json || { echo "::error::Unified candidate release-index.json is missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/kb-create-binary-smoke"
          cp .kb/release/release-index.json "$RUNNER_TEMP/kb-create-binary-smoke/release-index.json"
          node - "$RUNNER_TEMP/kb-create-binary-smoke/release-index.json" <<'NODE'
          const fs = require('node:fs');
          const index = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (index.schema !== 'kb.create.release-index/v2') throw new Error('candidate index is not release-index/v2');
          const labels = index.compatibility?.labels ?? [];
          for (const id of ['kb-create', 'kb-dev']) {
            if (!labels.some(label => label.kind === 'binary' && label.artifactId === id)) throw new Error(`candidate index has no binary compatibility label for ${id}`);
          }
          NODE
      - name: Download and verify published kb-create binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kb-create-binary-smoke"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern 'kb-create-linux-amd64' --pattern checksums.txt --dir "$out"
          (cd "$out" && grep -E '  kb-create-linux-amd64$' checksums.txt | sha256sum -c -)
          chmod +x "$out/kb-create-linux-amd64"
          node tools/kb-create/scripts/prepare-binary-manifest.mjs \
            --checksums "$out/checksums.txt" \
            --repository "$REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --output "$out/published-binary-manifest.json"
          node - "$out/release-index.json" "$out/published-binary-manifest.json" <<'NODE'
          const fs = require('node:fs');
          const [indexPath, manifestPath] = process.argv.slice(2);
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const binary = index.platforms.flatMap(platform => platform.binaries ?? []).find(item => item.id === 'kb-create' && item.os === 'linux' && item.arch === 'amd64');
          const published = manifest.binaries.find(item => item.id === 'kb-create' && item.os === 'linux' && item.arch === 'amd64');
          if (!binary) throw new Error('candidate index has no linux/amd64 kb-create binary');
          if (!published || JSON.stringify(binary) !== JSON.stringify(published)) throw new Error('candidate index kb-create metadata does not match the published asset');
          NODE
      - name: Run published binary smoke against public packages
        working-directory: tools/kb-create
        env:
          KB_CREATE_BINARY: ${{ runner.temp }}/kb-create-binary-smoke/kb-create-linux-amd64
          KB_CREATE_RELEASE_INDEX: ${{ runner.temp }}/kb-create-binary-smoke/release-index.json
          KB_CREATE_PACKAGE_TAG: canary
        run: go test -v -race -count=1 -timeout 12m -run '^TestPublishedV2JourneyReachesPluginWorkflow$' ./v2/e2e/...
