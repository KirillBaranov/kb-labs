name: Promote npm candidate

# Stable is never published directly.  This workflow is the only stable
# transition: it accepts a completed candidate workflow run, verifies that its
# exact manifest is currently available under the canary dist-tag, and moves
# those same immutable versions to latest with `npm dist-tag add`.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (for example platform-v2.118.1)
        required: true
        type: string
      candidate_run_id:
        description: Successful publish-npm-on-tag run that passed canary smoke
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-npm-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote smoke-tested canary
    runs-on: ubuntu-latest
    outputs:
      flow: ${{ steps.release.outputs.flow }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" =~ ^(platform|sdk)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            flow="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            echo "::error::Unsupported release tag: ${RELEASE_TAG}"
            exit 1
          fi

          test "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ || {
            echo "::error::candidate_run_id must be a numeric GitHub Actions run id"
            exit 1
          }

          run_json="$(gh run view "$CANDIDATE_RUN_ID" --json databaseId,event,headBranch,headSha,conclusion,status,workflowName,jobs)"
          jq -e --arg tag "$RELEASE_TAG" '
            .workflowName == "Publish npm (on release tag)" and
            .event == "push" and
            .status == "completed" and
            .conclusion == "success" and
            ([.jobs[] | select(.name == "Deliver candidate to npm") | .conclusion] | . == ["success"]) and
            ([.jobs[] | select(.name == "kb-create post-publish smoke") | .conclusion] | . == ["success"])
          ' <<<"$run_json" >/dev/null || {
            echo "::error::Candidate run ${CANDIDATE_RUN_ID} is not a successful canary+smoke run for ${RELEASE_TAG}"
            gh run view "$CANDIDATE_RUN_ID" --json status,conclusion,workflowName,jobs
            exit 1
          }

          tag_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          run_sha="$(jq -r '.headSha' <<<"$run_json")"
          if test "$tag_sha" != "$run_sha"; then
            echo "::error::Candidate run ${CANDIDATE_RUN_ID} points at ${run_sha}, not ${RELEASE_TAG} (${tag_sha})"
            exit 1
          fi

          echo "flow=$flow" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download the candidate manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-artifacts
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .kb/release/artifacts/

      - name: Verify canary points at the candidate manifest
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -s .kb/release/artifacts/manifest.json

          while IFS=$'\t' read -r name version; do
            actual="$(npm view "${name}@canary" version \
              --registry https://registry.npmjs.org \
              --prefer-online \
              --fetch-retries=3 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=5000)"
            if test "$actual" != "$version"; then
              echo "::error::Canary mismatch for ${name}: got '${actual}', expected '${version}'"
              exit 1
            fi
            echo "Canary verified: ${name}@${version}"
          done < <(node -e '
            const manifest = require("./.kb/release/artifacts/manifest.json");
            for (const artifact of manifest) console.log(artifact.name + "\t" + artifact.version);
          ')

      - name: Promote the exact canary versions to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          npm_latest() {
            npm view "$1" dist-tags.latest \
              --registry https://registry.npmjs.org \
              --prefer-online \
              --fetch-retries=3 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=5000 \
              2>/dev/null || true
          }

          promote_and_verify() {
            local name="$1"
            local version="$2"
            local actual=""

            for attempt in $(seq 1 12); do
              echo "Promoting ${name}@${version} (attempt ${attempt}/12)"
              npm dist-tag add "${name}@${version}" latest \
                --registry https://registry.npmjs.org \
                --prefer-online \
                >/dev/null 2>&1 || true

              actual="$(npm_latest "$name")"
              if test "$actual" = "$version"; then
                return 0
              fi
              echo "Waiting for npm convergence: ${name} latest=${actual:-<unavailable>}, expected=${version}"
              sleep 5
            done

            echo "::error::npm latest did not converge for ${name}: got '${actual}', expected '${version}'"
            return 1
          }

          while IFS=$'\t' read -r name version; do
            promote_and_verify "$name" "$version"
          done < <(node -e '
            const manifest = require("./.kb/release/artifacts/manifest.json");
            for (const artifact of manifest) console.log(artifact.name + "\t" + artifact.version);
          ')

  github-release:
    name: Create GitHub Release after promotion
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Extract changelog section
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          FLOW="${RELEASE_TAG%%-v*}"
          VERSION="${RELEASE_TAG#"$FLOW"-v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("^## \\[" ver "\\]")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "_No changelog entry found for ${VERSION}._" > release-notes.md
          echo "flow=$FLOW" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build immutable installer manifest
        if: steps.notes.outputs.flow == 'platform'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          binaries_tag="$(gh api 'repos/${{ github.repository }}/releases?per_page=100' --paginate --jq '.[] | select(.tag_name | endswith("-binaries")) | .tag_name' | head -n1)"
          test -n "$binaries_tag"
          node scripts/generate-installer-manifest.mjs \
            --release-tag "${{ inputs.release_tag }}" \
            --binaries-tag "$binaries_tag" \
            --output .kb/release/installer-manifest.json

      - name: Build immutable release receipt
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          FLOW: ${{ needs.promote.outputs.flow }}
          VERSION: ${{ needs.promote.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          manifest=.kb/release/artifacts/manifest.json
          test -s "$manifest"
          tag_sha="$(git rev-list -n1 "$RELEASE_TAG")"
          manifest_sha256="$(sha256sum "$manifest" | awk '{print $1}')"
          packages="$(node -e '
            const manifest = require(process.argv[1]);
            process.stdout.write(JSON.stringify(manifest.map(({ name, version }) => ({ name, version }))));
          ' "$manifest")"
          jq -n \
            --arg releaseTag "$RELEASE_TAG" \
            --arg sourceSha "$tag_sha" \
            --arg flow "$FLOW" \
            --arg version "$VERSION" \
            --arg candidateRunId "$CANDIDATE_RUN_ID" \
            --arg candidateRunUrl "https://github.com/$REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            --arg manifestSha256 "$manifest_sha256" \
            --argjson packages "$packages" \
            '{
              schema: 1,
              releaseTag: $releaseTag,
              sourceSha: $sourceSha,
              flow: $flow,
              version: $version,
              candidate: {
                runId: $candidateRunId,
                runUrl: $candidateRunUrl,
                distTag: "canary",
                smoke: "passed"
              },
              promotion: {
                distTag: "latest",
                verified: true
              },
              manifest: {
                sha256: $manifestSha256,
                packages: $packages
              }
            }' > release-receipt.json

          jq -e '
            .schema == 1 and
            (.releaseTag | length > 0) and
            (.sourceSha | length > 0) and
            .candidate.smoke == "passed" and
            .promotion.verified == true and
            (.manifest.packages | length > 0)
          ' release-receipt.json >/dev/null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "${{ needs.promote.outputs.flow }} v${{ needs.promote.outputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-receipt.json
            ${{ needs.promote.outputs.flow == 'platform' && '.kb/release/installer-manifest.json' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installer-channel:
    name: Publish installer stable channel
    if: needs.promote.outputs.flow == 'platform'
    needs: [promote, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish stable channel pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .kb/release/channel
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern installer-manifest.json --dir .kb/release/channel
          checksum="$(sha256sum .kb/release/channel/installer-manifest.json | awk '{print $1}')"
          manifest_url="https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/installer-manifest.json"
          jq -n \
            --arg releaseTag "$RELEASE_TAG" \
            --arg manifestUrl "$manifest_url" \
            --arg sha256 "$checksum" \
            '{schema: 1, channel: "stable", releaseTag: $releaseTag, manifestUrl: $manifestUrl, sha256: $sha256}' \
            > .kb/release/channel/channel.json
          if ! gh release view installer-stable --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create installer-stable --repo "$REPOSITORY" \
              --title "KB Labs installer stable channel" \
              --notes "Mutable stable channel pointer for kb-create."
          fi
          gh release upload installer-stable .kb/release/channel/channel.json \
            --repo "$REPOSITORY" --clobber
