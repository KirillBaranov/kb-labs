name: Reusable — kb-create e2e (Verdaccio)

# Reusable workflow for the kb-create end-to-end test suite.
#
# Runs the Go e2e suite against a local Verdaccio instance populated from
# the monorepo's built packages — the correct pre-publish validation cycle.
#
# Setup order:
#   go-tools artifact → pnpm install → pack .tgz → start Verdaccio (port 4873)
#   → publish packages → run Go e2e with KB_REGISTRY_URL=http://localhost:4873
#
# Called by ci-pr.yml (gated — only when kb-create sources changed) and
# ci.yml (always — validates every push to main).

on:
  workflow_call:
    inputs:
      # When true, only run if tools/kb-create/ was modified in the diff.
      # ci-pr.yml passes true; ci.yml passes false (always run on main).
      gate:
        description: "Skip when no kb-create changes (diff-based gate)"
        type: boolean
        default: false

env:
  COMPOSE_FILE: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.ci-launcher.yml
  COMPOSE_PROJECT_NAME: kb-e2e-launcher

jobs:
  launcher-e2e:
    name: kb-create e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { run_install: false }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: go-tools
          path: tools-bin/

      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev

      # ── Gate (ci-pr only) ─────────────────────────────────────────────
      # When gate=true, skip all subsequent steps if kb-create sources are
      # unchanged. On main (gate=false) the check is skipped — always run.

      - name: Check if kb-create changed
        if: inputs.gate
        id: gate
        run: |
          set -euo pipefail
          changed=$(.devkit/affected.sh || true)
          if echo "$changed" | grep -qE '^tools/kb-create/'; then
            echo "run=true"  >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # All expensive steps below are skipped when the gate says no changes.
      # On main (gate=false) the `if` condition is always true.

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        with:
          name: dist

      - name: Extract dist artifacts
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        run: tar xf dist-artifacts.tar

      - name: Install dependencies
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # ── Pack packages for Verdaccio ───────────────────────────────────

      - name: Restore packed .tgz cache
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        id: tgz-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: e2e/packages/
          key: e2e-tgz-v3-${{ runner.os }}-${{ hashFiles('**/dist/**/*.js', '**/dist/**/*.d.ts', '**/package.json') }}

      - name: Pack @kb-labs/* packages
        if: (inputs.gate == false || steps.gate.outputs.run == 'true') && steps.tgz-cache.outputs.cache-hit != 'true'
        run: bash e2e/scripts/pack-all.sh

      # ── Start Verdaccio ───────────────────────────────────────────────
      # docker-compose.ci-launcher.yml adds ports: ["4873:4873"] so the Go
      # tests running on the host runner can reach http://localhost:4873.

      - name: Set up Docker Buildx
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Cache Docker layers (publisher)
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/.buildx-cache-publisher
          key: buildx-publisher-${{ hashFiles('e2e/publisher/**', 'e2e/packages/**') }}
          restore-keys: buildx-publisher-

      - name: Build publisher image
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache-publisher \
            --cache-to   type=local,dest=/tmp/.buildx-cache-publisher,mode=max \
            --load \
            -t kb-e2e-ci-publisher:latest \
            -f e2e/publisher/Dockerfile \
            e2e/

      - name: Restore Verdaccio storage cache
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        id: verdaccio-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: e2e/.verdaccio-storage
          key: verdaccio-storage-v2-${{ runner.os }}-${{ hashFiles('e2e/packages/**/*.tgz') }}

      - name: Prepare Verdaccio storage permissions
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio to be healthy
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        run: |
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q "healthy"; then
              echo "Verdaccio healthy after $((i * 2))s"; break
            fi
            sleep 2
          done

      - name: Publish packages to Verdaccio
        if: (inputs.gate == false || steps.gate.outputs.run == 'true') && steps.verdaccio-cache.outputs.cache-hit != 'true'
        run: docker compose run --rm publisher

      - name: Confirm Verdaccio warm cache
        if: (inputs.gate == false || steps.gate.outputs.run == 'true') && steps.verdaccio-cache.outputs.cache-hit == 'true'
        run: |
          tgz_count=$(find e2e/packages -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')
          pkg_dirs=$(find e2e/.verdaccio-storage/@kb-labs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          echo "Tarballs: $tgz_count  Verdaccio dirs: $pkg_dirs"
          if [ "$pkg_dirs" -lt "$((tgz_count / 2))" ]; then
            echo "::warning::Storage incomplete, re-publishing"
            docker compose run --rm publisher
          fi

      # ── Run kb-create Go e2e tests ────────────────────────────────────
      # KB_REGISTRY_URL is read by pm.Detect() — pnpm inside kb-create install
      # will point to local Verdaccio instead of npm.org.
      # NPM_CONFIG_REGISTRY is intentionally NOT set here: pm.Detect() only
      # falls back to KB_REGISTRY_URL when NPM_CONFIG_REGISTRY is absent.

      - name: Test curl installer entrypoint
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        run: bash tools/kb-create/install_test.sh

      - name: Run kb-create e2e via devkit
        if: inputs.gate == false || steps.gate.outputs.run == 'true'
        run: ./tools/kb-devkit/kb-devkit run e2e --packages kb-create --no-cache
        env:
          KB_REGISTRY_URL: http://localhost:4873
          GITHUB_TOKEN: ${{ github.token }}

      # ── Cleanup ───────────────────────────────────────────────────────

      - name: Stop Verdaccio
        if: always() && (inputs.gate == false || steps.gate.outputs.run == 'true')
        run: docker compose down --volumes --remove-orphans || true

      - name: Restore Verdaccio storage ownership for cache save
        if: always() && (inputs.gate == false || steps.gate.outputs.run == 'true')
        run: |
          if [ -d e2e/.verdaccio-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage
          fi

      - name: Skipped
        if: inputs.gate && steps.gate.outputs.run != 'true'
        run: echo "kb-create e2e skipped (no kb-create changes)"
