name: CI evidence replay

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: 'Completed Actions run whose jobs/artifacts should be summarized'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  replay:
    name: Replay CI evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download source run diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        run: gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern '*platform-logs*' --dir ci-evidence-artifacts
      - name: Render evidence from source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        run: node scripts/ci/ci-evidence-summary.mjs --repository "$GITHUB_REPOSITORY" --run-id "$SOURCE_RUN_ID" --logs-dir ci-evidence-artifacts --output ci-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload replay evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-evidence-replay-${{ inputs.source-run-id }}
          path: ci-evidence.json
          retention-days: 30
