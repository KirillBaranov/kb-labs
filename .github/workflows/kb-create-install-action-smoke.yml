name: kb-create-install action smoke test

# Ad-hoc verification that the reusable .github/actions/kb-create-install
# composite action installs the platform the way an external consumer repo
# would: bootstrap the launcher from the public install script, resolve a
# channel pointer, install a plugin.
#
# This is deliberately separate from the Go-level e2e suite (tools/kb-create/
# v2/e2e/), which tests kb-create itself built from source on every PR — this
# workflow instead proves the *packaged, reusable action* wrapping a released
# launcher works.
#
# It needs a live release endpoint serving a published channel pointer, so it
# stays workflow_dispatch: there is nothing for it to resolve until the control
# plane has actually published something.

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin ID to install (must be in the manifest catalog)'
        required: true
        default: 'release'
      platform_channel:
        description: 'Channel to install from'
        required: false
        default: 'stable'
        type: choice
        options: [stable, canary]
      release_base:
        description: 'Release endpoint; override to smoke a non-production namespace'
        required: false
        default: 'https://releases.kb-labs.dev'

permissions:
  contents: read

jobs:
  smoke:
    name: Install ${{ inputs.plugin }} via the reusable action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install via kb-create-install action
        id: kb
        uses: ./.github/actions/kb-create-install
        with:
          plugins: ${{ inputs.plugin }}
          platform-channel: ${{ inputs.platform_channel }}
          release-base: ${{ inputs.release_base }}
          platform-dir: ${{ runner.temp }}/kb-platform-action-smoke

      - name: Verify the action reported the release it resolved
        run: |
          set -euo pipefail
          # An empty release id means the launcher installed something it could
          # not name, which is the one outcome the descriptor protocol exists to
          # make impossible.
          test -n "${{ steps.kb.outputs.release-id }}"
          echo "resolved release: ${{ steps.kb.outputs.release-id }}"

      - name: Verify the plugin package is actually there
        run: |
          set -euo pipefail
          find "${{ steps.kb.outputs.platform-dir }}/node_modules/@kb-labs" -maxdepth 1 -type d
          test -f "${{ steps.kb.outputs.config-path }}"
          echo "config-path output: ${{ steps.kb.outputs.config-path }}"
          grep -q '"release": {' "${{ steps.kb.outputs.config-path }}" || {
            echo "::error::plugins.release block missing from generated config"
            exit 1
          }

      - name: Confirm no unselected services leaked in
        run: |
          set -euo pipefail
          devservices="${{ steps.kb.outputs.platform-dir }}/.kb/devservices.yaml"
          if [ -f "$devservices" ] && grep -qE "gateway|workflow-daemon" "$devservices"; then
            echo "::error::unselected service present in devservices.yaml — install is not scoped"
            cat "$devservices"
            exit 1
          fi
          echo "OK — no unselected service leaked in"
