name: Publish npm (on release tag)

# CI half of the "plugin prepares, CI delivers" release flow — the release
# plugin (plugins/release/manager-core + manager-cli) owns every decision
# about what ships and whether it's correct; this workflow only checks out
# a tag, asks the plugin to pack once, and runs a thin delivery job that
# hands the already-packed artifact to npm. See the release plan and
# plugins/release/docs/adr/0001-*.
#
#   1. Prepare (local, `.kb/workflows/release-prepare.yml` or
#      `pnpm release:platform:prepare` / `release:sdk:prepare`) — checks,
#      build, version bump, changelog, then commits + tags + pushes git.
#      Never touches npm, needs no npm credentials.
#   2. Stage (this workflow, job `stage`) — `kb release stage` packs the
#      already-committed versions into real npm tarballs, once, and
#      uploads them as a build artifact. No re-bump, no re-plan.
#   3. Deliver candidate (this workflow, job `deliver-candidate`) — downloads
#      that exact artifact and publishes it under the `canary` dist-tag.
#   4. User gate (job `launcher-smoke`) — installs and exercises the candidate.
#
# Stable promotion is deliberately not part of this workflow.  A separate,
# manual `promote-npm-release.yml` workflow promotes only these exact,
# smoke-tested canary versions.  This keeps candidate publication and stable
# promotion independently retryable and makes it impossible for a failed smoke
# to be mistaken for a failed publish.
#
# Tag grammar: `<flow>-v<version>` (e.g. `platform-v2.105.0`,
# `sdk-v3.2.0`) — one literal, disjoint prefix per flow, so this workflow's
# trigger can never collide with binaries' unrelated `v*-binaries` tags
# (release-binaries.yml / .goreleaser.yaml — untouched, different artifact
# family entirely). `kb release stage`/`deliver` resolve {flow, channel}
# from the tag themselves (release.flows[*].tagPattern) — this workflow
# never guesses.

on:
  push:
    tags:
      - "platform-v*"
      - "sdk-v*"

permissions:
  contents: read
  id-token: write # reserved for a future move to npm Trusted Publishing (OIDC) — unused today

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reject tags outside main
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit already reachable from main."
            echo "::error::Tag: $GITHUB_REF_NAME; commit: $GITHUB_SHA"
            exit 1
          fi

  stage:
    name: Stage
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/kb-devkit/go.mod
      - name: Build kb-devkit (host)
        run: make build -C tools/kb-devkit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rebuild at the exact tagged commit — dist/ is gitignored, so the
      # "prepare" step's build output never made it into this checkout.
      - name: Build (topological order)
        run: ./tools/kb-devkit/kb-devkit run build --no-cache

      # This belongs to the release workflow: it projects each built runtime
      # manifest into a JSON-only launcher sidecar before `pnpm pack`. The
      # release plugin keeps doing exactly one thing — producing tarballs.
      - name: Emit V2 launcher manifests into built packages
        run: node tools/kb-create/v2/release/emit-manifests.mjs .

      - name: Stage (pack committed versions into real tarballs, once)
        run: pnpm kb release stage --release-tag "${{ github.ref_name }}"

      # The release plugin owns only exact tarballs. The launcher contract is
      # a workflow gate: inspect those bytes after staging, before anything is
      # uploaded or published. A missing/mismatched V2 package manifest is a
      # candidate defect, never a reason for kb-create to guess configuration.
      - name: Materialize and verify V2 package manifests
        if: startsWith(github.ref_name, 'platform-v')
        run: |
          go run ./v2/cmd/kb-create-v2-stage-manifests \
            --stage-manifest .kb/release/artifacts/manifest.json \
            --topology ./v2/release/platform-topology.json \
            --output .kb/release/v2-manifests
        working-directory: tools/kb-create

      # Topology is reviewed source; versions, tarball names, checksums,
      # config requirements and service commands are all taken from the exact
      # staged artifacts. This is a draft index: registry URLs are rebound
      # only after candidate publication proves npm serves these same bytes.
      - name: Seal V2 release-index from staged artifacts
        if: startsWith(github.ref_name, 'platform-v')
        run: |
          go run ./v2/cmd/kb-create-v2-index \
            --input ./v2/release/platform-topology.json \
            --stage-manifest .kb/release/artifacts/manifest.json \
            --manifest-root .kb/release/v2-manifests \
            --output .kb/release/artifacts/release-index.draft.json
        working-directory: tools/kb-create

      - name: Archive built workspace output for delivery
        shell: bash
        run: |
          dist_dirs=()
          while IFS= read -r -d '' dir; do
            dist_dirs+=("$dir")
          done < <(find . -type d -name dist \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './.kb/*' \
            -print0)
          tar -czf .kb/release/artifacts/workspace-dist.tar.gz "${dist_dirs[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: .kb/release/artifacts/
          # Promotion is a separate manual workflow; retain the exact staged
          # manifest/tarballs long enough for a human gate and investigation.
          retention-days: 30

  deliver-candidate:
    name: Deliver candidate to npm
    needs: stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/kb-devkit/go.mod
      - name: Build kb-devkit (host)
        run: make build -C tools/kb-devkit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .kb/release/artifacts/

      - name: Restore built workspace output
        run: tar -xzf .kb/release/artifacts/workspace-dist.tar.gz -C .

      - name: Deliver candidate (publish the staged tarballs as-is)
        run: pnpm kb release deliver --release-tag "${{ github.ref_name }}" --target npm --tag canary
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm is now the source from which users will install. Re-download every
      # selected tarball and refuse the release unless it matches the staged
      # SHA-256 before publishing the installable index.
      - name: Bind public V2 release-index to candidate npm bytes
        if: startsWith(github.ref_name, 'platform-v')
        run: |
          go run ./v2/cmd/kb-create-v2-bind-registry \
            --input .kb/release/artifacts/release-index.draft.json \
            --stage-manifest .kb/release/artifacts/manifest.json \
            --output .kb/release/artifacts/release-index.json
        working-directory: tools/kb-create

      - name: Archive installable V2 release-index
        if: startsWith(github.ref_name, 'platform-v')
        uses: actions/upload-artifact@v4
        with:
          name: kb-create-release-index
          path: .kb/release/artifacts/release-index.json
          retention-days: 30

  # Post-publish launcher smoke runs one bounded, isolated kb-create journey
  # against the packages we just delivered to npm. The exhaustive lifecycle
  # suite runs separately: promotion must fail quickly with a precise boundary,
  # never because an unrelated final test consumed a global suite timeout.
  # Last-mile
  # gate: if any transitive dep was published with broken workspace:* deps,
  # missing versions, unreadable manifests, or similar publish-time
  # regressions, this job turns red instead of a user bug report. Runs after
  # delivery (not before) because the e2e pulls real packages from the npm
  # registry — a pre-publish smoke would install the previous release.
  launcher-smoke:
    name: kb-create post-publish smoke
    if: startsWith(github.ref_name, 'platform-v')
    runs-on: ubuntu-latest
    needs: deliver-candidate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/kb-create/go.mod
          cache-dependency-path: tools/kb-create/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: kb-create-release-index
          path: .kb/release-index/
      - name: Build host kb-devkit
        run: make build
        working-directory: tools/kb-devkit
      - name: Install exact canary artifacts and render the generated service graph
        # This is a real clean install from the public candidate URLs. The
        # small kb-dev protocol double keeps this post-publish gate bounded;
        # service process startup remains covered by the sharded integration
        # suite and cannot hide a package/config publication regression here.
        run: |
          set -euo pipefail
          root="$(mktemp -d)/platform"
          fake_kb_dev="$(mktemp)"
          cat > "$fake_kb_dev" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$*" == *" status --json"* ]]; then
            printf '%s\n' '{"services":{"state-daemon":{"state":"alive"},"workflow":{"state":"alive"},"rest":{"state":"alive"},"marketplace":{"state":"alive"},"gateway":{"state":"alive"},"mcp-daemon":{"state":"alive"},"studio":{"state":"alive"}}}'
          fi
          EOF
          chmod +x "$fake_kb_dev"
          go run . apply \
            --index "$GITHUB_WORKSPACE/.kb/release-index/release-index.json" \
            --request-platform-root "$root" \
            --platform-channel canary \
            --policy compatible \
            --registry https://registry.npmjs.org \
            --kb-dev "$fake_kb_dev"
          test -s "$root/.kb/kb.config.jsonc"
          test -s "$root/.kb/devservices.yaml"
        working-directory: tools/kb-create
