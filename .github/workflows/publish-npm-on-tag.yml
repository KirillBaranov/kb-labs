name: Publish npm (on release tag)

# CI half of the "plugin prepares, CI delivers" release flow — the release
# plugin (plugins/release/manager-core + manager-cli) owns every decision
# about what ships and whether it's correct; this workflow only checks out
# a tag, asks the plugin to pack once, and runs a thin delivery job that
# hands the already-packed artifact to npm. See the release plan and
# plugins/release/docs/adr/0001-*.
#
#   1. Prepare (local, `.kb/workflows/release-prepare.yml` or
#      `pnpm release:platform:prepare` / `release:sdk:prepare`) — checks,
#      build, version bump, changelog, then commits + tags + pushes git.
#      Never touches npm, needs no npm credentials.
#   2. Stage (this workflow, job `stage`) — `kb release stage` packs the
#      already-committed versions into real npm tarballs, once, and
#      uploads them as a build artifact. No re-bump, no re-plan.
#   3. Deliver candidate (this workflow, job `deliver-candidate`) — downloads
#      that exact artifact and publishes it under the `canary` dist-tag.
#   4. User gate (job `launcher-smoke`) — installs and exercises the candidate.
#   5. Promote (job `promote-stable`) — moves the same immutable versions to
#      `latest`; no repack or rebuild is allowed after the gate.
#
# Tag grammar: `<flow>-v<version>` (e.g. `platform-v2.105.0`,
# `sdk-v3.2.0`) — one literal, disjoint prefix per flow, so this workflow's
# trigger can never collide with binaries' unrelated `v*-binaries` tags
# (release-binaries.yml / .goreleaser.yaml — untouched, different artifact
# family entirely). `kb release stage`/`deliver` resolve {flow, channel}
# from the tag themselves (release.flows[*].tagPattern) — this workflow
# never guesses.

on:
  push:
    tags:
      - "platform-v*"
      - "sdk-v*"

permissions:
  contents: read
  id-token: write # reserved for a future move to npm Trusted Publishing (OIDC) — unused today

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reject tags outside main
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit already reachable from main."
            echo "::error::Tag: $GITHUB_REF_NAME; commit: $GITHUB_SHA"
            exit 1
          fi

  stage:
    name: Stage
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/kb-devkit/go.mod
      - name: Build kb-devkit (host)
        run: make build -C tools/kb-devkit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rebuild at the exact tagged commit — dist/ is gitignored, so the
      # "prepare" step's build output never made it into this checkout.
      - name: Build (topological order)
        run: ./tools/kb-devkit/kb-devkit run build --no-cache

      - name: Stage (pack committed versions into real tarballs, once)
        run: pnpm kb release stage --release-tag "${{ github.ref_name }}"

      - name: Archive built workspace output for delivery
        shell: bash
        run: |
          dist_dirs=()
          while IFS= read -r -d '' dir; do
            dist_dirs+=("$dir")
          done < <(find . -type d -name dist \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './.kb/*' \
            -print0)
          tar -czf .kb/release/artifacts/workspace-dist.tar.gz "${dist_dirs[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: .kb/release/artifacts/
          retention-days: 7

  deliver-candidate:
    name: Deliver candidate to npm
    needs: stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/kb-devkit/go.mod
      - name: Build kb-devkit (host)
        run: make build -C tools/kb-devkit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .kb/release/artifacts/

      - name: Restore built workspace output
        run: tar -xzf .kb/release/artifacts/workspace-dist.tar.gz -C .

      - name: Deliver candidate (publish the staged tarballs as-is)
        run: pnpm kb release deliver --release-tag "${{ github.ref_name }}" --target npm --tag canary
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Create a GitHub Release for the tag, with the actual changelog section
  # for this version as the release body — so the tag shows up as a real,
  # readable release instead of a bare tag with no notes. The release plugin
  # already writes per-version entries into the repo-root CHANGELOG.md
  # (plugins/release/manager-core/src/publisher.ts); this just slices out
  # the one section for the version this tag names and hands it to
  # softprops/action-gh-release verbatim.
  github-release:
    name: GitHub Release
    needs: promote-stable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Extract changelog section for this version
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          FLOW="${TAG%%-v*}"
          VERSION="${TAG#"$FLOW"-v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("^## \\[" ver "\\]")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "_No changelog entry found for ${VERSION} — see commit history._" > release-notes.md
          fi

          echo "flow=$FLOW" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ steps.notes.outputs.flow }} v${{ steps.notes.outputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Post-publish launcher smoke (kb-create e2e) — runs the full kb-create
  # end-to-end suite against the packages we just delivered to npm. Last-mile
  # gate: if any transitive dep was published with broken workspace:* deps,
  # missing versions, unreadable manifests, or similar publish-time
  # regressions, this job turns red instead of a user bug report. Runs after
  # delivery (not before) because the e2e pulls real packages from the npm
  # registry — a pre-publish smoke would install the previous release.
  launcher-smoke:
    name: kb-create post-publish smoke
    runs-on: ubuntu-latest
    needs: deliver-candidate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/kb-create/go.mod
          cache-dependency-path: tools/kb-create/go.sum
      - name: Build host kb-devkit
        run: make build
        working-directory: tools/kb-devkit
      - name: Run kb-create e2e against just-published packages
        run: ./tools/kb-devkit/kb-devkit run e2e --packages kb-create --no-cache
        env:
          # The candidate is published under the canary dist-tag. Without
          # this override kb-create resolves `latest` and tests the previous
          # stable release instead of the artifacts delivered above.
          KB_CREATE_PACKAGE_TAG: canary

  # Stable npm is a promotion, never the first publication. The manifest is
  # downloaded from the same staged artifact that the candidate delivery job
  # used, so this job can only move versions that were actually smoke-tested.
  promote-stable:
    name: Promote candidate to stable
    needs: [deliver-candidate, launcher-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .kb/release/artifacts/
      - name: Promote the smoke-tested versions to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          # npm's dist-tag write is eventually consistent with `npm view`.
          # Use an online read and retry the idempotent write instead of
          # failing a release on a stale registry/cache response.
          npm_latest() {
            npm view "$1" dist-tags.latest \
              --registry https://registry.npmjs.org \
              --prefer-online \
              --fetch-retries=3 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=5000 \
              2>/dev/null || true
          }

          promote_and_verify() {
            local name="$1"
            local version="$2"
            local spec="${name}@${version}"
            local actual=""

            for attempt in $(seq 1 12); do
              echo "Promoting ${spec} to latest (attempt ${attempt}/12)"
              npm dist-tag add "${spec}" latest \
                --registry https://registry.npmjs.org \
                --prefer-online \
                >/dev/null 2>&1 || true

              actual="$(npm_latest "${name}")"
              if test "${actual}" = "${version}"; then
                return 0
              fi

              echo "Waiting for npm registry convergence: ${name} latest=${actual:-<unavailable>}, expected=${version}"
              sleep 5
            done

            echo "::error::npm latest tag did not converge for ${name}: got '${actual}', expected '${version}'"
            return 1
          }

          while IFS=$'\t' read -r name version; do
            promote_and_verify "${name}" "${version}"
          done < <(node -e '
            const manifest = require("./.kb/release/artifacts/manifest.json");
            for (const artifact of manifest) console.log(artifact.name + "\t" + artifact.version);
          ')
