name: Publish npm (on release tag)

# CI half of the "plugin prepares, CI delivers" release flow — the release
# plugin (plugins/release/manager-core + manager-cli) owns every decision
# about what ships and whether it's correct; this workflow only checks out
# a tag, asks the plugin to pack once, and runs a thin delivery job that
# hands the already-packed artifact to npm. See the release plan and
# plugins/release/docs/adr/0001-*.
#
#   1. Prepare (local, `.kb/workflows/release-prepare.yml` or
#      `pnpm release:platform:prepare` / `release:sdk:prepare`) — checks,
#      build, version bump, changelog, then commits + tags + pushes git.
#      Never touches npm, needs no npm credentials.
#   2. Stage (this workflow, job `stage`) — verifies the prepared
#      release-index.json and stages the already-committed versions into real
#      npm tarballs once. No catalog generation, re-bump, or re-plan happens
#      in CI.
#   3. Deliver candidate (this workflow, job `deliver-candidate`) — downloads
#      that exact artifact and publishes it under the `canary` dist-tag.
#   4. User gate (job `launcher-smoke`) — installs and exercises the candidate.
#
# Stable promotion is deliberately not part of this workflow.  A separate,
# manual `promote-npm-release.yml` workflow promotes only these exact,
# smoke-tested canary versions.  This keeps candidate publication and stable
# promotion independently retryable and makes it impossible for a failed smoke
# to be mistaken for a failed publish.
#
# Tag grammar: `<flow>-v<version>` (e.g. `platform-v2.105.0`,
# `sdk-v3.2.0`) — one literal, disjoint prefix per flow, so this workflow's
# trigger can never collide with binaries' unrelated `v*-binaries` tags
# (release-binaries.yml / .goreleaser.yaml — untouched, different artifact
# family entirely). `kb release stage`/`deliver` resolve {flow, channel}
# from the tag themselves (release.flows[*].tagPattern) — this workflow
# never guesses.

on:
  push:
    tags:
      - "platform-v*"
      - "sdk-v*"

permissions:
  contents: read
  id-token: write # reserved for a future move to npm Trusted Publishing (OIDC) — unused today

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reject tags outside master
        run: |
          set -euo pipefail
          git fetch origin master --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Release tags must point to a commit already reachable from master."
            echo "::error::Tag: $GITHUB_REF_NAME; commit: $GITHUB_SHA"
            exit 1
          fi

  stage:
    name: Stage
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/kb-devkit/go.mod
      - name: Build kb-devkit (host)
        run: make build -C tools/kb-devkit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rebuild at the exact tagged commit — dist/ is gitignored, so the
      # "prepare" step's build output never made it into this checkout.
      - name: Build (topological order)
        run: ./tools/kb-devkit/kb-devkit run build --no-cache

      - name: Stage (pack committed versions into real tarballs, once)
        run: pnpm kb release stage --release-tag "${{ github.ref_name }}"

      - name: Attach prepared release index
        shell: bash
        run: |
          set -euo pipefail
          test -s .kb/release/release-index.json || {
            echo "::error::Prepared release-index.json is missing from the release tag"
            exit 1
          }
          cp .kb/release/release-index.json .kb/release/artifacts/release-index.json

      - name: Archive built workspace output for delivery
        shell: bash
        run: |
          dist_dirs=()
          while IFS= read -r -d '' dir; do
            dist_dirs+=("$dir")
          done < <(find . -type d -name dist \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './.kb/*' \
            -print0)
          tar -czf .kb/release/artifacts/workspace-dist.tar.gz "${dist_dirs[@]}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-artifacts
          path: .kb/release/artifacts/
          # Promotion is a separate manual workflow; retain the exact staged
          # manifest/tarballs long enough for a human gate and investigation.
          retention-days: 30

  deliver-candidate:
    name: Deliver candidate to npm
    needs: stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/kb-devkit/go.mod
      - name: Build kb-devkit (host)
        run: make build -C tools/kb-devkit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-artifacts
          path: .kb/release/artifacts/

      - name: Restore built workspace output
        run: tar -xzf .kb/release/artifacts/workspace-dist.tar.gz -C .

      - name: Deliver candidate (publish the staged tarballs as-is)
        run: pnpm kb release deliver --release-tag "${{ github.ref_name }}" --target npm --tag canary
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Post-publish launcher smoke runs one bounded, isolated kb-create journey
  # against the packages we just delivered to npm. The exhaustive lifecycle
  # suite runs separately: promotion must fail quickly with a precise boundary,
  # never because an unrelated final test consumed a global suite timeout.
  # Last-mile
  # gate: if any transitive dep was published with broken workspace:* deps,
  # missing versions, unreadable manifests, or similar publish-time
  # regressions, this job turns red instead of a user bug report. Runs after
  # delivery (not before) because the e2e pulls real packages from the npm
  # registry — a pre-publish smoke would install the previous release.
  launcher-smoke:
    name: kb-create post-publish smoke
    runs-on: ubuntu-latest
    needs: deliver-candidate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/kb-create/go.mod
          cache-dependency-path: tools/kb-create/go.sum
      - name: Build host kb-devkit
        run: make build
        working-directory: tools/kb-devkit
      - name: Run isolated kb-create release smoke against just-published packages
        # The Make target has its own 12-minute Go-suite deadline and executes
        # just the promotion-critical journey. The full lifecycle matrix is a
        # separate, sharded signal rather than a hidden dependency of this gate.
        run: make e2e-release-smoke
        working-directory: tools/kb-create
        env:
          # The candidate is published under the canary dist-tag. Without
          # this override kb-create resolves `latest` and tests the previous
          # stable release instead of the artifacts delivered above.
          KB_CREATE_PACKAGE_TAG: canary

      - name: Verify published candidate compatibility marker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const index = JSON.parse(fs.readFileSync('.kb/release/release-index.json', 'utf8'));
          const marker = index.compatibility;
          if (!marker || marker.schema !== 'kb.release-compatibility/1') throw new Error('release index has no compatibility marker');
          if (marker.status !== 'prepared') throw new Error(`unexpected compatibility marker status: ${marker.status}`);
          if (!marker.platform?.version || !marker.sdk?.version) throw new Error('compatibility marker has no exact Platform/SDK pair');
          if (index.channels?.canary !== marker.platform.version) throw new Error('canary channel does not point at marked platform');
          console.log(`compatibility marker: ${marker.platform.version} + ${marker.sdk.version} (${marker.line})`);
          NODE

      - name: Capture release-smoke diagnostics
        if: always()
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -u
          out=/tmp/kb-create-release-smoke
          mkdir -p "$out"
          {
            echo "release_tag=$RELEASE_TAG"
            echo "source_sha=$SOURCE_SHA"
            echo "captured_at=$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_os=$RUNNER_OS"
          } > "$out/context.env"
          {
            node --version
            pnpm --version
            go version
          } > "$out/toolchain.txt" 2>&1 || true
          ps auxww > "$out/processes.txt" 2>&1 || true
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true) > "$out/listening-ports.txt" 2>&1
          df -h > "$out/disk.txt" 2>&1 || true
          (free -h 2>/dev/null || vm_stat 2>/dev/null || true) > "$out/memory.txt" 2>&1
          find "$RUNNER_TEMP" -maxdepth 2 -type d -name 'TestReleaseCandidateJourney*' -print \
            > "$out/retained-fixtures.txt" 2>&1 || true

      - name: Upload release-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kb-create-release-smoke-diagnostics-${{ github.run_id }}
          path: /tmp/kb-create-release-smoke/
          retention-days: 30
