name: E2E Testbed

# Pre-release gate: provisions an INSTALLED platform (user-mode, via kb-create +
# local Verdaccio) from a profile and verifies it actually runs — the same
# kb-env binary used locally. Unlike per-domain e2e (which run against workspace
# sources), this exercises the real installed packages.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/kb-env/**'
      - 'tools/kb-create/**'
      - 'tools/kb-dev/**'
      - 'e2e/testbed/**'
      - '.github/workflows/e2e-testbed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-testbed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testbed:
    name: Provision + verify (profile=mind)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build (TS dist + Go tools)
        run: |
          ./tools/kb-devkit/kb-devkit run build
          make -C tools/kb-create build
          make -C tools/kb-dev build
          make -C tools/kb-env build

      - name: Provision environment (kb-env up)
        run: ./tools/kb-env/kb-env up mind --json

      - name: Verify gateway is healthy
        run: |
          curl -fsS http://127.0.0.1:4000/health | tee /dev/stderr | grep -q '"status":"healthy"'

      - name: Verify installed CLI runs as a user (not pnpm kb)
        run: ./tools/kb-env/kb-env exec -- kb marketplace plugins list

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kb-env-logs
          path: ~/.kb-env/current/logs
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: ./tools/kb-env/kb-env down --rm || true
