name: CI (PR)

on:
  pull_request:
    # A maintainer can request the expensive full regression by adding
    # `full-ci`; removing it returns the PR to the affected-only lane.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  # e2e-platform publishes flaky-history to the ci-data branch. Jobs below
  # explicitly narrow this back to read unless they need that write access.
  contents: write

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Diff base: PR base branch (e.g. origin/main...HEAD)
env:
  KB_DEVKIT_BASE_REF: >-
    ${{ format('origin/{0}...HEAD', github.event.pull_request.base.ref) }}

jobs:
  # ── 0. Preflight — gates everything else (~30s) ────────────────────────────
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Single Version Policy (versions + format)
        run: pnpm deps:lint

  # ── 0a. Resolve E2E ownership from the complete PR diff ──────────────────
  # The same JSON plan drives the selective E2E jobs below.
  e2e-test-plan:
    name: E2E test plan
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve zones from the complete PR diff
        run: |
          mkdir -p .ci
          node scripts/ci/resolve-e2e-zones.mjs \
            --base-ref "$KB_DEVKIT_BASE_REF" \
            --output .ci/e2e-test-plan.json \
            --markdown .ci/e2e-test-plan.md
          cat .ci/e2e-test-plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update PR test-plan comment
        # Fork PR tokens cannot write comments; their plan remains available in
        # the job summary and artifact.
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- kb-ci-test-plan -->';
            const body = fs.readFileSync('.ci/e2e-test-plan.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-test-plan
          path: .ci/e2e-test-plan.json
          retention-days: 14

  # ── 1. Build Go tools ──────────────────────────────────────────────────────
  build-tools:
    name: Build Go tools
    needs: preflight
    uses: ./.github/workflows/build-go-tools.yml
    permissions:
      contents: read

  # ── 2. Build TS packages in the complete PR diff closure ───────────────────
  build:
    name: Build TS (affected)
    runs-on: ubuntu-latest
    needs: [preflight, build-tools]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (affected dependency closure)
        # GitHub runners start with an empty .kb/devkit state. Without
        # --diff-only every package is classified as "dirty", defeating the
        # affected graph and rebuilding the full workspace on every PR.
        run: ./tools/kb-devkit/kb-devkit run build --affected --diff-only
      - name: Pack dist artifacts
        run: find . -path "*/dist" -not -path "*/node_modules/*" -type d | tar cf dist-artifacts.tar -T -
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist-artifacts.tar
          retention-days: 1
          compression-level: 3

  # ── 3. Lint / Type-check / Test — affected packages only ───────────────────
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        task: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.task }} on affected packages
        run: ./tools/kb-devkit/kb-devkit run ${{ matrix.task }} --affected --diff-only

  # ── 4. Workspace checks — devkit structure, deps and boundaries ────────────
  devkit-checks:
    name: Devkit checks
    runs-on: ubuntu-latest
    needs: [build-tools, build, e2e-test-plan]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install kb-devkit
        run: |
          chmod +x tools-bin/kb-devkit
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: Devkit workspace checks (structure, dependencies, boundaries)
        run: ./tools/kb-devkit/kb-devkit check

  # ── 5. kb-create e2e — only if launcher or kb-dev sources changed ──────────
  #
  # Runs the Go e2e suite for kb-create against a local Verdaccio instance
  # populated from this PR's built packages — the correct pre-publish cycle.
  # Also covers tools/kb-dev: the suite installs a real platform and drives
  # kb-dev's register/switch/projects commands against it.
  #
  # Setup order:
  #   build → pack .tgz → start Verdaccio (Docker, port 4873) →
  #   publish → run Go e2e tests with KB_REGISTRY_URL=http://localhost:4873
  #
  # KB_REGISTRY_URL is read by kb-create's pm.Detect() and passed to pnpm as
  # --registry, so all pnpm install calls in the tests point to Verdaccio.
  # NPM_CONFIG_REGISTRY is intentionally NOT set: pm.Detect() only falls back
  # to KB_REGISTRY_URL when NPM_CONFIG_REGISTRY is absent.
  launcher-e2e:
    name: kb-create e2e
    runs-on: ubuntu-latest
    needs: [build-tools, build]
    # The step-level gate below selects launcher changes. Keep the job itself
    # unconditional so tools/kb-create/** changes reach that gate even when a
    # PR does not carry the optional full-ci label.
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      COMPOSE_FILE: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.ci-launcher.yml
      COMPOSE_PROJECT_NAME: kb-e2e-launcher

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with: { run_install: false }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/

      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev

      - name: Download E2E test plan
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-plan
          path: .ci

      - name: Apply E2E zone gate
        id: gate-result
        run: |
          set -euo pipefail
          if node -e '
            const plan = require("./.ci/e2e-test-plan.json");
            process.exit(plan.selected.some((zone) => zone.runner === "launcher") ? 0 : 1);
          '; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # All steps below are gated — skip the expensive Verdaccio setup when
      # neither kb-create nor kb-dev sources changed.

      - uses: actions/download-artifact@v4
        if: steps.gate-result.outputs.run == 'true'
        with:
          name: dist

      - name: Extract dist artifacts
        if: steps.gate-result.outputs.run == 'true'
        run: tar xf dist-artifacts.tar

      - name: Install dependencies
        if: steps.gate-result.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build launcher package closure
        if: steps.gate-result.outputs.run == 'true'
        run: |
          packages=$(node -e '
            const manifest = require("./tools/kb-create/internal/manifest/manifest.json");
            const names = [
              ...(manifest.core ?? []).map((item) => item.name),
              ...(manifest.services ?? []).map((item) => item.pkg),
              ...(manifest.adapters ?? []).map((item) => item.name),
              ...(manifest.plugins ?? []).map((item) => item.pkg),
            ].filter(Boolean);
            process.stdout.write([...new Set(names)].join(","));
          ')
          ./tools/kb-devkit/kb-devkit run build --packages "$packages" --no-cache

      # ── Pack packages for Verdaccio ──────────────────────────────────────

      - name: Pack @kb-labs/* packages
        if: steps.gate-result.outputs.run == 'true'
        run: bash e2e/scripts/pack-all.sh

      # ── Start Verdaccio ──────────────────────────────────────────────────
      # docker-compose.ci-launcher.yml adds ports: ["4873:4873"] so the Go
      # tests running on the host can reach http://localhost:4873.

      - name: Set up Docker Buildx
        if: steps.gate-result.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build publisher image
        if: steps.gate-result.outputs.run == 'true'
        run: |
          docker buildx build \
            --cache-from "type=gha,scope=e2e-publisher" \
            --cache-to "type=gha,mode=max,scope=e2e-publisher" \
            --load \
            -t kb-e2e-ci-publisher:latest \
            -f e2e/publisher/Dockerfile \
            e2e/

      - name: Prepare Verdaccio storage permissions
        if: steps.gate-result.outputs.run == 'true'
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio
        if: steps.gate-result.outputs.run == 'true'
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio to be healthy
        if: steps.gate-result.outputs.run == 'true'
        run: |
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q "healthy"; then
              echo "Verdaccio healthy after $((i * 2))s"; break
            fi
            sleep 2
          done

      - name: Publish packages to Verdaccio
        if: steps.gate-result.outputs.run == 'true'
        run: docker compose run --rm publisher

      # ── Run kb-create Go e2e tests ───────────────────────────────────────
      # KB_REGISTRY_URL is read by pm.Detect() — pnpm inside kb-create install
      # will point to local Verdaccio instead of npm.org.

      - name: Run kb-create e2e via devkit
        if: steps.gate-result.outputs.run == 'true'
        run: ./tools/kb-devkit/kb-devkit run e2e --packages kb-create --no-cache
        env:
          KB_REGISTRY_URL: http://localhost:4873
          GITHUB_TOKEN: ${{ github.token }}
          # Unlimited failure output — kb-devkit's default 50-line truncation
          # hides exactly the per-service LogsTail/state detail needed to
          # diagnose a failure here, and this job has no log-upload step
          # (unlike ci.yml's equivalent) to fall back on.
          KB_DEVKIT_FAIL_LINES: "0"

      # ── Cleanup ──────────────────────────────────────────────────────────

      - name: Stop Verdaccio
        if: always() && steps.gate-result.outputs.run == 'true'
        run: docker compose down --volumes --remove-orphans || true

      - name: Restore Verdaccio storage ownership for cache save
        if: always() && steps.gate-result.outputs.run == 'true'
        run: |
          if [ -d e2e/.verdaccio-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage
          fi

      - name: Skipped
        if: steps.gate-result.outputs.run != 'true'
        run: echo "kb-create e2e skipped (no kb-create changes in this PR)"

  # ── Full E2E — opt in per PR; always runs after a successful main CI ──────

  e2e-platform:
    if: contains(github.event.pull_request.labels.*.name, 'full-ci')
    needs: [build]
    uses: ./.github/workflows/e2e-platform.yml
    permissions:
      # flaky-history (added in e2e-platform.yml) pushes to the ci-data
      # branch and needs write; a caller can't grant a reusable workflow
      # more than it itself holds, and under-granting here causes the
      # entire run to fail at startup (0 jobs) before anything executes.
      contents: write
      actions: read
