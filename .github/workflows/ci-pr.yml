name: CI (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # e2e-platform publishes flaky-history to the ci-data branch. Jobs below
  # explicitly narrow this back to read unless they need that write access.
  contents: write

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Diff base: PR base branch (e.g. origin/main...HEAD)
env:
  KB_DEVKIT_BASE_REF: >-
    ${{ format('origin/{0}...HEAD', github.event.pull_request.base.ref) }}

jobs:
  # ── 0. Preflight — gates everything else (~30s) ────────────────────────────
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Single Version Policy (versions + format)
        run: pnpm deps:lint

  # ── 1. Build Go tools ──────────────────────────────────────────────────────
  build-tools:
    name: Build Go tools
    needs: preflight
    uses: ./.github/workflows/build-go-tools.yml
    permissions:
      contents: read

  # ── 2. Build TS packages in the complete PR diff closure ───────────────────
  build:
    name: Build TS (affected)
    runs-on: ubuntu-latest
    needs: [preflight, build-tools]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (devkit, complete workspace)
        run: ./tools/kb-devkit/kb-devkit run build
      - name: Pack dist artifacts
        run: find . -path "*/dist" -not -path "*/node_modules/*" -type d | tar cf dist-artifacts.tar -T -
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist-artifacts.tar
          retention-days: 1
          compression-level: 3

  # ── 2a. Exact base snapshot for the PR fast E2E overlay ───────────────────
  # The normal path restores this from main's cache. On the first rollout, or
  # after cache eviction, build the exact PR base SHA once instead of falling
  # back to a potentially stale npm @kb-labs/* package.
  base-snapshot:
    name: Build exact base E2E snapshot
    runs-on: ubuntu-latest
    needs: [preflight, build-tools]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev tools/kb-dev/kb-dev
      - name: Restore exact base snapshot cache
        id: base-cache
        uses: actions/cache@v4
        with:
          path: |
            e2e/packages-base
            base-dist-artifacts.tar
          key: e2e-base-tgz-v4-${{ github.event.pull_request.base.sha }}
      - name: Install base dependencies
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build base packages
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: ./tools/kb-devkit/kb-devkit run build --no-cache
      - name: Pack base packages
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: bash e2e/scripts/pack-all.sh "$GITHUB_WORKSPACE/e2e/packages-base"
      - name: Archive base dist packages
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: find . -path '*/node_modules/*' -prune -o -path '*/.kb/*' -prune -o -type d -name dist -print | tar cf base-dist-artifacts.tar -T -
      - name: Validate exact base E2E snapshot
        run: |
          count=$(find "$GITHUB_WORKSPACE/e2e/packages-base" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')
          echo "Base snapshot tarballs: $count"
          test "$count" -gt 100
          test -s "$GITHUB_WORKSPACE/base-dist-artifacts.tar"

  # ── 3. Lint / Type-check / Test — affected packages only ───────────────────
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        task: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.task }} on affected packages
        run: ./tools/kb-devkit/kb-devkit run ${{ matrix.task }} --affected --diff-only

  # ── 4. Workspace checks — devkit structure, deps and boundaries ────────────
  devkit-checks:
    name: Devkit checks
    runs-on: ubuntu-latest
    needs: [build-tools, build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install kb-devkit
        run: |
          chmod +x tools-bin/kb-devkit
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: Devkit workspace checks (structure, dependencies, boundaries)
        run: ./tools/kb-devkit/kb-devkit check

  # ── 5. kb-create e2e — only if launcher or kb-dev sources changed ──────────
  #
  # Runs the Go e2e suite for kb-create against a local Verdaccio instance
  # populated from this PR's built packages — the correct pre-publish cycle.
  # Also covers tools/kb-dev: the suite installs a real platform and drives
  # kb-dev's register/switch/projects commands against it.
  #
  # Setup order:
  #   build → pack .tgz → start Verdaccio (Docker, port 4873) →
  #   publish → run Go e2e tests with KB_REGISTRY_URL=http://localhost:4873
  #
  # KB_REGISTRY_URL is read by kb-create's pm.Detect() and passed to pnpm as
  # --registry, so all pnpm install calls in the tests point to Verdaccio.
  # NPM_CONFIG_REGISTRY is intentionally NOT set: pm.Detect() only falls back
  # to KB_REGISTRY_URL when NPM_CONFIG_REGISTRY is absent.
  launcher-e2e:
    name: kb-create e2e
    runs-on: ubuntu-latest
    needs: [build-tools, build]
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      COMPOSE_FILE: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.ci-launcher.yml
      COMPOSE_PROJECT_NAME: kb-e2e-launcher

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with: { run_install: false }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/

      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev

      - name: Should run e2e?
        id: gate
        run: |
          set -euo pipefail
          changed=$(.devkit/affected.sh || true)
          # tools/kb-create e2e also exercises tools/kb-dev (the e2e suite
          # installs a real platform and drives kb-dev's register/switch/
          # projects commands against it — see e2e/kbdev_registry_test.go),
          # so a kb-dev-only PR must trigger this job too, not just kb-create.
          if echo "$changed" | grep -qE '^tools/(kb-create|kb-dev)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # All steps below are gated — skip the expensive Verdaccio setup when
      # neither kb-create nor kb-dev sources changed.

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: dist

      - name: Extract dist artifacts
        if: steps.gate.outputs.run == 'true'
        run: tar xf dist-artifacts.tar

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # ── Pack packages for Verdaccio ──────────────────────────────────────

      - name: Restore packed .tgz cache
        if: steps.gate.outputs.run == 'true'
        id: tgz-cache
        uses: actions/cache@v4
        with:
          path: e2e/packages/
          key: e2e-tgz-v2-${{ runner.os }}-${{ hashFiles('**/dist/**/*.js', '**/dist/**/*.d.ts', '**/package.json') }}

      - name: Pack @kb-labs/* packages
        if: steps.gate.outputs.run == 'true' && steps.tgz-cache.outputs.cache-hit != 'true'
        run: bash e2e/scripts/pack-all.sh

      # ── Start Verdaccio ──────────────────────────────────────────────────
      # docker-compose.ci-launcher.yml adds ports: ["4873:4873"] so the Go
      # tests running on the host can reach http://localhost:4873.

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers (publisher)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-publisher
          key: buildx-publisher-${{ hashFiles('e2e/publisher/**', 'e2e/packages/**') }}
          restore-keys: buildx-publisher-

      - name: Build publisher image
        if: steps.gate.outputs.run == 'true'
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache-publisher \
            --cache-to   type=local,dest=/tmp/.buildx-cache-publisher,mode=max \
            --load \
            -t kb-e2e-ci-publisher:latest \
            -f e2e/publisher/Dockerfile \
            e2e/

      - name: Restore Verdaccio storage cache
        if: steps.gate.outputs.run == 'true'
        id: verdaccio-cache
        uses: actions/cache@v4
        with:
          path: e2e/.verdaccio-storage
          key: verdaccio-storage-${{ runner.os }}-${{ hashFiles('e2e/packages/**/*.tgz') }}

      - name: Prepare Verdaccio storage permissions
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio
        if: steps.gate.outputs.run == 'true'
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio to be healthy
        if: steps.gate.outputs.run == 'true'
        run: |
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q "healthy"; then
              echo "Verdaccio healthy after $((i * 2))s"; break
            fi
            sleep 2
          done

      - name: Publish packages to Verdaccio
        if: steps.gate.outputs.run == 'true' && steps.verdaccio-cache.outputs.cache-hit != 'true'
        run: docker compose run --rm publisher

      - name: Confirm Verdaccio warm cache
        if: steps.gate.outputs.run == 'true' && steps.verdaccio-cache.outputs.cache-hit == 'true'
        run: |
          tgz_count=$(find e2e/packages -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')
          pkg_dirs=$(find e2e/.verdaccio-storage/@kb-labs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          echo "Tarballs: $tgz_count  Verdaccio dirs: $pkg_dirs"
          if [ "$pkg_dirs" -lt "$((tgz_count / 2))" ]; then
            echo "::warning::Storage incomplete, re-publishing"
            docker compose run --rm publisher
          fi

      # ── Run kb-create Go e2e tests ───────────────────────────────────────
      # KB_REGISTRY_URL is read by pm.Detect() — pnpm inside kb-create install
      # will point to local Verdaccio instead of npm.org.

      - name: Run kb-create e2e via devkit
        if: steps.gate.outputs.run == 'true'
        run: ./tools/kb-devkit/kb-devkit run e2e --packages kb-create --no-cache
        env:
          KB_REGISTRY_URL: http://localhost:4873
          # Unlimited failure output — kb-devkit's default 50-line truncation
          # hides exactly the per-service LogsTail/state detail needed to
          # diagnose a failure here, and this job has no log-upload step
          # (unlike ci.yml's equivalent) to fall back on.
          KB_DEVKIT_FAIL_LINES: "0"

      # ── Cleanup ──────────────────────────────────────────────────────────

      - name: Stop Verdaccio
        if: always() && steps.gate.outputs.run == 'true'
        run: docker compose down --volumes --remove-orphans || true

      - name: Restore Verdaccio storage ownership for cache save
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          if [ -d e2e/.verdaccio-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage
          fi

      - name: Skipped
        if: steps.gate.outputs.run != 'true'
        run: echo "kb-create e2e skipped (no kb-create changes in this PR)"

  # ── E2E suites — run after the shared build, in parallel with checks ───────

  e2e-platform:
    needs: [build]
    uses: ./.github/workflows/e2e-platform.yml
    permissions:
      # flaky-history (added in e2e-platform.yml) pushes to the ci-data
      # branch and needs write; a caller can't grant a reusable workflow
      # more than it itself holds, and under-granting here causes the
      # entire run to fail at startup (0 jobs) before anything executes.
      contents: write
      actions: read
  fast-plugin-e2e:
    name: Fast Plugin E2E
    needs: [build, base-snapshot]
    uses: ./.github/workflows/e2e-plugins.yml
    with:
      dist-artifact: dist
      go-tools-artifact: go-tools
      base-snapshot-key: e2e-base-tgz-v4-${{ github.event.pull_request.base.sha }}
    permissions:
      contents: read
      actions: read
  e2e-auth:
    needs: [build]
    uses: ./.github/workflows/reusable-e2e-playwright.yml
    with:
      suite: auth
      compose-files: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.auth-ci.yml
      compose-project: kb-e2e-auth
      run-command: cd e2e/auth && pnpm e2e
      report-dir: e2e/auth/report
      artifact-prefix: auth
      studio: true
      studio-https: false
      idp: false
    permissions:
      contents: read

  e2e-oauth:
    needs: [build]
    uses: ./.github/workflows/reusable-e2e-playwright.yml
    with:
      suite: oauth
      compose-files: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.auth-ci.yml:e2e/docker-compose.oauth-ci.yml
      compose-project: kb-e2e-oauth
      run-command: cd e2e/auth && pnpm e2e:oauth
      report-dir: e2e/auth/report-oauth
      artifact-prefix: oauth
      studio: true
      studio-https: true
      idp: true
      hosts-entry: "127.0.0.1 kb-cloud.kblabs.ru"
    permissions:
      contents: read

  e2e-marketplace:
    needs: [build]
    uses: ./.github/workflows/reusable-e2e-docker.yml
    with:
      suite: marketplace
      e2e-package: "@kb-labs/e2e-marketplace"
      health-url: http://localhost:5070/health
      health-steps: 36
      compose-project: kb-e2e-marketplace
    permissions:
      contents: read

  e2e-rest-api:
    needs: [build]
    uses: ./.github/workflows/reusable-e2e-docker.yml
    with:
      suite: rest-api
      e2e-package: "@kb-labs/e2e-rest-api"
      health-url: http://localhost:5050/api/v1/health
      health-steps: 36
      playwright-dir: e2e/rest-api
      compose-project: kb-e2e-rest-api
    permissions:
      contents: read
