name: Security scan

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write   # required to upload SARIF results

jobs:
  # ── 1. npm / pnpm dependency CVEs ─────────────────────────────────────────
  audit-npm:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # No `version:` here — pnpm/action-setup reads packageManager from
      # package.json; specifying both errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level moderate

  # ── 2. Go dependency CVEs ─────────────────────────────────────────────────
  audit-go:
    name: govulncheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # report every module's vulns, don't cancel siblings
      matrix:
        module:
          - tools/kb-create
          - tools/kb-dev
          - tools/kb-devkit
          - tools/kb-env
          - tools/kb-monitor
          - tools/clikit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          # Pin a patched toolchain so govulncheck checks against fixed stdlib
          # (GO-2026-5037/5039 fixed in go1.25.11, GO-2026-4971 in go1.25.10,
          # GO-2026-5856 ECH privacy leak fixed in go1.25.12, GO-2026-5026 idna
          # Punycode validation and GO-2026-5972 asn1 recursion depth both
          # fixed in go1.25.13).
          # Each module's go.mod also carries `toolchain go1.25.13` so the
          # shipped binaries are built with the same patched stdlib, not just
          # the scan. Building older `go` directives with 1.25.13 is compatible.
          go-version: '1.25.13'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        working-directory: ${{ matrix.module }}

  # ── 3. Secrets in code and git history ────────────────────────────────────
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0   # full history — gitleaks scans all commits
      # Use the OSS gitleaks binary directly: gitleaks-action@v2 demands a paid
      # GITLEAKS_LICENSE for organization repos; the binary does not. Scans with
      # .gitleaks.toml (default rules + path allowlist of known test fixtures).
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  # ── 4. SAST — injections, path traversal, info disclosure ─────────────────
  sast:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config "p/typescript" \
            --config "p/nodejs" \
            --config "p/golang" \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --sarif \
            --output semgrep.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
