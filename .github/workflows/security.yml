name: Security scan

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write   # required to upload SARIF results

jobs:
  # ── 1. npm / pnpm dependency CVEs ─────────────────────────────────────────
  audit-npm:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # No `version:` here — pnpm/action-setup reads packageManager from
      # package.json; specifying both errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level moderate

  # ── 2. Go dependency CVEs ─────────────────────────────────────────────────
  audit-go:
    name: govulncheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # report every module's vulns, don't cancel siblings
      matrix:
        module:
          - tools/kb-create
          - tools/kb-dev
          - tools/kb-devkit
          - tools/kb-env
          - tools/kb-monitor
          - tools/kb-deploy
          - tools/clikit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # Pin a patched toolchain so govulncheck checks against fixed stdlib
          # (GO-2026-5037/5039 fixed in go1.25.11, GO-2026-4971 in go1.25.10/
          # go1.26.3, GO-2026-5856 ECH privacy leak fixed in go1.25.12,
          # GO-2026-5026 idna Punycode validation and GO-2026-5972 asn1
          # recursion depth fixed in go1.25.13/go1.26.6).
          # kb-monitor and kb-deploy also need golang.org/x/crypto >= v0.56.0
          # for GO-2026-6355/6354 (ssh channel DoS), which requires `go 1.26`
          # in their go.mod — hence the toolchain-wide bump to go1.26.8 here.
          # Their go.mod now carries `toolchain go1.26.8`; the remaining
          # modules still pin `toolchain go1.25.13`, which is compatible with
          # this newer scanning toolchain.
          go-version: '1.26.8'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
        working-directory: ${{ matrix.module }}

  # ── 3. Secrets in code and git history ────────────────────────────────────
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0   # full history — gitleaks scans all commits
      # Use the OSS gitleaks binary directly: gitleaks-action@v2 demands a paid
      # GITLEAKS_LICENSE for organization repos; the binary does not. Scans with
      # .gitleaks.toml (default rules + path allowlist of known test fixtures).
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  # ── 4. SAST — injections, path traversal, info disclosure ─────────────────
  sast:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config "p/typescript" \
            --config "p/nodejs" \
            --config "p/golang" \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --sarif \
            --output semgrep.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
