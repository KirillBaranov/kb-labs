name: CI

on:
  push:
    branches: [main]
    # Skip workflow on changes that cannot affect lint / type-check / tests.
    # Sites code is intentionally NOT ignored here — it's part of the
    # monorepo and is type-checked / linted by CI even though it deploys
    # via deploy.yml.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.vscode/**'
      - '.idea/**'
      - '.editorconfig'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch: {}

permissions:
  contents: read

# Group by ref (branch) instead of SHA so a new commit cancels the
# in-flight run of the previous one. Cancelled runs are visible in the
# UI — not silently dropped.
concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. kb-create V2 contract matrix — deterministic and independent ───────
  # Kept separate from Verdaccio/Docker launcher E2E so a configuration or
  # recovery regression has a small, stable failure domain.
  launcher-v2-contracts:
    name: kb-create V2 / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: resolver-config
            packages: ./v2/catalog ./v2/cmd/kb-create-v2 ./v2/cmd/kb-create-v2-index ./v2/contracts ./v2/release ./v2/resolve ./v2/render ./v2/scenario ./v2/secrets ./v2/telemetry ./v2/transport ./v2/wizard
          - shard: runtime-recovery
            packages: ./v2/artifacts ./v2/logs ./v2/receipt ./v2/lifecycle ./v2/runtime
          - shard: doctor-diagnostics
            packages: ./v2/doctor ./v2/diagnostics ./v2/installed
          - shard: offline-journey
            packages: ./v2/journey ./v2/services ./v2/verify
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/kb-create
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tools/kb-create/go.sum
      - name: Enforce autonomous V2 boundary
        run: |
          if go list -deps ${{ matrix.packages }} | grep -q '^github.com/kb-labs/create/internal/'; then
            echo 'V2 must not import legacy launcher internals.' >&2
            exit 1
          fi
      - name: Run deterministic V2 contract shard
        run: go test -race -count=1 ${{ matrix.packages }}

  # ── 1. Build Go tools (host Linux binary) ────────────────────────────────────
  # Single host build — used by every downstream job via artifact restore.
  # All quality checks (lint/test/e2e) are driven through kb-devkit so the
  # same task graph and cache semantics apply everywhere.
  build-tools:
    name: Build Go tools
    uses: ./.github/workflows/build-go-tools.yml

  # ── 2. Build all TS packages via devkit (topological order) ──────────────────
  build:
    name: Build TS (devkit)
    runs-on: ubuntu-latest
    needs: build-tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (devkit, topological, no cache)
        run: ./tools/kb-devkit/kb-devkit run build --no-cache
      - name: Pack dist artifacts
        run: find . -path "*/dist" -not -path "*/node_modules/*" -type d | tar cf dist-artifacts.tar -T -
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist-artifacts.tar
          retention-days: 1
          compression-level: 3
      - name: Pack exact main E2E snapshot
        run: bash e2e/scripts/pack-all.sh "$GITHUB_WORKSPACE/e2e/packages-base"
      - name: Archive exact main dist snapshot
        run: find . -path '*/node_modules/*' -prune -o -path '*/.kb/*' -prune -o -type d -name dist -print | tar cf base-dist-artifacts.tar -T -
      - name: Upload exact main E2E snapshot
        uses: actions/upload-artifact@v4
        with:
          name: e2e-base-snapshot-${{ github.sha }}
          path: |
            e2e/packages-base
            base-dist-artifacts.tar
          retention-days: 7
          compression-level: 0
      - name: Validate exact main E2E snapshot
        run: |
          count=$(find "$GITHUB_WORKSPACE/e2e/packages-base" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')
          echo "Base snapshot tarballs: $count"
          test "$count" -gt 100
          test -s "$GITHUB_WORKSPACE/base-dist-artifacts.tar"

  # ── 2b. Dependency hygiene (Single Version Policy) ─────────────────────────
  deps:
    name: Deps (syncpack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Single Version Policy (versions + format)
        run: pnpm deps:lint

  # ── 2c. Plugin entry structure ─────────────────────────────────────────────
  plugin-structure:
    name: Plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node infra/devkit/bin/devkit-check-plugins.mjs --ci

  # ── 3. Lint / Type-check / Test — all packages ──────────────────────────────
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        task: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.task }}
        run: ./tools/kb-devkit/kb-devkit run ${{ matrix.task }} --no-cache

  # ── 4. Site quality checks — seo, i18n, broken links ──────────────────────
  site-checks:
    name: site checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: SEO check
        run: node sites/web/apps/web/scripts/seo-check.mjs --no-color
      - name: i18n check
        run: node sites/web/apps/web/scripts/i18n-check.mjs

  # ── 5. Coverage — run tests with instrumentation + check thresholds ─────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: Run coverage
        run: pnpm coverage

  # ── 5. kb-create e2e — always on main ──────────────────────────────────────
  #
  # Runs on every push to main (no gate). Uses Verdaccio populated from the
  # monorepo build — validates pre-publish packages that may not be on npm yet.
  #
  # Setup order:
  #   build → pack .tgz → start Verdaccio (Docker, port 4873) →
  #   publish → run Go e2e tests with KB_REGISTRY_URL=http://localhost:4873
  launcher-e2e:
    name: kb-create e2e / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [build-tools, build]
    timeout-minutes: 60
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - core-a
          - core-b
          - journeys
          - lifecycle

    env:
      COMPOSE_FILE: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.ci-launcher.yml
      COMPOSE_PROJECT_NAME: kb-e2e-launcher
      # This job tests the freshly packed workspace in local Verdaccio. Do not
      # fetch the public stable installer manifest (which may point at an older
      # release than this checkout); use the embedded product manifest and the
      # local registry packages instead.
      KB_CREATE_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with: { run_install: false }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/

      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev

      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Extract dist artifacts
        run: tar xf dist-artifacts.tar

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack @kb-labs/* packages
        run: bash e2e/scripts/pack-all.sh

      - name: Validate packed package metadata
        run: bash e2e/scripts/validate-packed-packages.sh "$GITHUB_WORKSPACE/e2e/packages"

      - name: Pre-pull BuildKit image
        run: |
          for i in 1 2 3; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "Attempt $i failed, retrying in 15s…"
            sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Build publisher image
        run: |
          docker buildx build \
            --load \
            -t kb-e2e-ci-publisher:latest \
            -f e2e/publisher/Dockerfile \
            e2e/

      - name: Prepare Verdaccio storage permissions
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio to be healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q "healthy"; then
              echo "Verdaccio healthy after $((i * 2))s"; break
            fi
            sleep 2
          done

      - name: Publish packages to Verdaccio
        run: docker compose run --rm publisher

      - name: Test curl installer entrypoint
        run: bash tools/kb-create/install_test.sh

      - name: Run kb-create e2e via devkit
        run: |
          ./tools/kb-devkit/kb-devkit run e2e --packages kb-create --no-cache \
            2>&1 | tee /tmp/kb-create-e2e-devkit.log; exit "${PIPESTATUS[0]}"
        env:
          KB_REGISTRY_URL: http://localhost:4873
          GITHUB_TOKEN: ${{ github.token }}
          # setup-node may expose NPM_CONFIG_REGISTRY globally; keep the
          # launcher e2e install on the local testbed registry explicitly.
          NPM_CONFIG_REGISTRY: http://localhost:4873
          KB_DEVKIT_FAIL_LINES: 0
          E2E_RUN: >-
            ${{ matrix.shard == 'core-a' && '^Test(DeclarativeEngineScenarioDiscoveryInspectPlanAndPlanOnlyApply|Help|Version|SubcommandHelp|StatusMissingPlatform|DoctorNoArgs|InstallYes|FirstCommitNoChanges|FirstCommitPromptShown|Update|ReinstallIdempotent|LogsCommand|KbCliSmoke|ServicesStartStop|LLMFlagRemoved|NoLLMByDefault|DefaultKeepsAuthOn|LocalModeWritesAuthOff)$' || matrix.shard == 'core-b' && '^Test(NoPeerDepWarnings|PlatformFilesGenerated|GitignoreEntries|DemoReviewSkipsUntrackedOnly|DemoHintShownAfterZeroFindings|KbConfigShowSplitRoot|GeneratedWorkflowsUseWorkflowIdFlag|GeneratedDemoWorkflowUsesRealCommands|DemoFlagDoesNotChangeInstalledPackages|DoctorDockerCheckIsAdvisoryNotFatal|InstallScopedPlugin|InstallUnknownPluginFailsFast)$' || matrix.shard == 'journeys' && '^Test(TwoProjectsShareOnePlatformIsolated|NoPlaceholderValuesInGeneratedConfigs|SoloDeveloperJourney|LegacyProjectMigrationJourney|CIInstallJourney_PinnedPluginsServicesAndAdapters|CIInstallJourney_UnconfiguredRequiredCapabilityWarns|CIInstallJourney_ExecutesInstalledPlugin|PlatformUpdateAndUninstallPreservesUserArtifacts|AdapterSwitchJourney|KbDevRegistrySwitch_MultiProjectSharedPlatform)$' || '^Test(Lifecycle_InstallSwapRollback|PlatformDirMkdirFailsHardAbort|UninstallRetryThenHardFail)$' }}

      - name: Upload kb-create e2e log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kb-create-e2e-log-${{ github.run_id }}
          path: /tmp/kb-create-e2e-devkit.log
          retention-days: 14

      - name: Stop Verdaccio
        if: always()
        run: docker compose down --volumes --remove-orphans || true

      - name: Restore Verdaccio storage ownership for cache save
        if: always()
        run: |
          if [ -d e2e/.verdaccio-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage
          fi
