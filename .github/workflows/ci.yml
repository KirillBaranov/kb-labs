name: CI

on:
  push:
    branches: [main]
    # Skip workflow on changes that cannot affect lint / type-check / tests.
    # Sites code is intentionally NOT ignored here — it's part of the
    # monorepo and is type-checked / linted by CI even though it deploys
    # via deploy.yml.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.vscode/**'
      - '.idea/**'
      - '.editorconfig'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch: {}

permissions:
  contents: read

# Group by ref (branch) instead of SHA so a new commit cancels the
# in-flight run of the previous one. Cancelled runs are visible in the
# UI — not silently dropped.
concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Build Go tools (host Linux binary) ────────────────────────────────────
  # Single host build — used by every downstream job via artifact restore.
  # All quality checks (lint/test/e2e) are driven through kb-devkit so the
  # same task graph and cache semantics apply everywhere.
  build-tools:
    name: Build Go tools
    uses: ./.github/workflows/build-go-tools.yml

  # ── 2. Build all TS packages via devkit (topological order) ──────────────────
  build:
    name: Build TS (devkit)
    runs-on: ubuntu-latest
    needs: build-tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (devkit, topological, no cache)
        run: ./tools/kb-devkit/kb-devkit run build --no-cache
      - name: Pack dist artifacts
        run: find . -path "*/dist" -not -path "*/node_modules/*" -type d | tar cf dist-artifacts.tar -T -
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist-artifacts.tar
          retention-days: 1
          compression-level: 3
      - name: Pack exact main E2E snapshot
        run: bash e2e/scripts/pack-all.sh "$GITHUB_WORKSPACE/e2e/packages-base"
      - name: Archive exact main dist snapshot
        run: find . -path '*/node_modules/*' -prune -o -path '*/.kb/*' -prune -o -type d -name dist -print | tar cf base-dist-artifacts.tar -T -
      - name: Cache exact main E2E snapshot
        uses: actions/cache@v4
        with:
          path: |
            e2e/packages-base
            base-dist-artifacts.tar
          key: e2e-base-tgz-v4-${{ github.sha }}
      - name: Validate exact main E2E snapshot
        run: |
          count=$(find "$GITHUB_WORKSPACE/e2e/packages-base" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')
          echo "Base snapshot tarballs: $count"
          test "$count" -gt 100
          test -s "$GITHUB_WORKSPACE/base-dist-artifacts.tar"

  # ── 2b. Dependency hygiene (Single Version Policy) ─────────────────────────
  deps:
    name: Deps (syncpack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Single Version Policy (versions + format)
        run: pnpm deps:lint

  # ── 2c. Plugin entry structure ─────────────────────────────────────────────
  plugin-structure:
    name: Plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node infra/devkit/bin/devkit-check-plugins.mjs --ci

  # ── 3. Lint / Type-check / Test — all packages ──────────────────────────────
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        task: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.task }}
        run: ./tools/kb-devkit/kb-devkit run ${{ matrix.task }} --no-cache

  # ── 4. Site quality checks — seo, i18n, broken links ──────────────────────
  site-checks:
    name: site checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: SEO check
        run: node sites/web/apps/web/scripts/seo-check.mjs --no-color
      - name: i18n check
        run: node sites/web/apps/web/scripts/i18n-check.mjs

  # ── 5. Coverage — run tests with instrumentation + check thresholds ─────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: Run coverage
        run: pnpm coverage

  # ── 5. kb-create e2e — always on main ──────────────────────────────────────
  #
  # Runs on every push to main (no gate). Uses Verdaccio populated from the
  # monorepo build — validates pre-publish packages that may not be on npm yet.
  #
  # Setup order:
  #   build → pack .tgz → start Verdaccio (Docker, port 4873) →
  #   publish → run Go e2e tests with KB_REGISTRY_URL=http://localhost:4873
  launcher-e2e:
    name: kb-create e2e
    runs-on: ubuntu-latest
    needs: [build-tools, build]
    timeout-minutes: 30
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    env:
      COMPOSE_FILE: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.ci-launcher.yml
      COMPOSE_PROJECT_NAME: kb-e2e-launcher

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with: { run_install: false }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/

      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev

      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Extract dist artifacts
        run: tar xf dist-artifacts.tar

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore packed .tgz cache
        id: tgz-cache
        uses: actions/cache@v4
        with:
          path: e2e/packages/
          # Bump this namespace whenever packed workspace dependency metadata
          # changes. pnpm pack materializes workspace:* ranges into exact
          # versions, so reusing an older tarball can make the Verdaccio e2e
          # job test a package graph that is not present in this checkout.
          key: e2e-tgz-v3-${{ runner.os }}-${{ hashFiles('**/dist/**/*.js', '**/dist/**/*.d.ts', '**/package.json', 'pnpm-lock.yaml') }}

      - name: Pack @kb-labs/* packages
        if: steps.tgz-cache.outputs.cache-hit != 'true'
        run: bash e2e/scripts/pack-all.sh

      - name: Pre-pull BuildKit image
        run: |
          for i in 1 2 3; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "Attempt $i failed, retrying in 15s…"
            sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Cache Docker layers (publisher)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-publisher
          key: buildx-publisher-${{ hashFiles('e2e/publisher/**', 'e2e/packages/**') }}
          restore-keys: buildx-publisher-

      - name: Build publisher image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache-publisher \
            --cache-to   type=local,dest=/tmp/.buildx-cache-publisher,mode=max \
            --load \
            -t kb-e2e-ci-publisher:latest \
            -f e2e/publisher/Dockerfile \
            e2e/

      - name: Restore Verdaccio storage cache
        id: verdaccio-cache
        uses: actions/cache@v4
        with:
          path: e2e/.verdaccio-storage
          key: verdaccio-storage-v2-${{ runner.os }}-${{ hashFiles('e2e/packages/**/*.tgz') }}

      - name: Prepare Verdaccio storage permissions
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio to be healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q "healthy"; then
              echo "Verdaccio healthy after $((i * 2))s"; break
            fi
            sleep 2
          done

      - name: Publish packages to Verdaccio
        if: steps.verdaccio-cache.outputs.cache-hit != 'true'
        run: docker compose run --rm publisher

      - name: Confirm Verdaccio warm cache
        if: steps.verdaccio-cache.outputs.cache-hit == 'true'
        run: |
          tgz_count=$(find e2e/packages -maxdepth 1 -type f -name '*.tgz' 2>/dev/null | wc -l | tr -d ' ')
          pkg_dirs=$(find e2e/.verdaccio-storage/@kb-labs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          echo "Tarballs: $tgz_count  Verdaccio dirs: $pkg_dirs"
          if [ "$pkg_dirs" -lt "$((tgz_count / 2))" ]; then
            echo "::warning::Storage incomplete, re-publishing"
            docker compose run --rm publisher
          fi

      - name: Test curl installer entrypoint
        run: bash tools/kb-create/install_test.sh

      - name: Run kb-create e2e via devkit
        run: |
          ./tools/kb-devkit/kb-devkit run e2e --packages kb-create --no-cache \
            2>&1 | tee /tmp/kb-create-e2e-devkit.log; exit "${PIPESTATUS[0]}"
        env:
          KB_REGISTRY_URL: http://localhost:4873
          # setup-node may expose NPM_CONFIG_REGISTRY globally; keep the
          # launcher e2e install on the local testbed registry explicitly.
          NPM_CONFIG_REGISTRY: http://localhost:4873
          KB_DEVKIT_FAIL_LINES: 0

      - name: Upload kb-create e2e log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kb-create-e2e-log-${{ github.run_id }}
          path: /tmp/kb-create-e2e-devkit.log
          retention-days: 14

      - name: Stop Verdaccio
        if: always()
        run: docker compose down --volumes --remove-orphans || true

      - name: Restore Verdaccio storage ownership for cache save
        if: always()
        run: |
          if [ -d e2e/.verdaccio-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage
          fi
