name: E2E Platform Tests

# Full platform scenario tests — matrix of 8 suites, each shard runs the
# complete Docker-based setup via the shared reusable-e2e-docker workflow:
#
#   Build → Pack → Verdaccio → kb-create install → start services → run suite
#
# Triggers:
# - Every push to main (pre-release validation)
# - After every binary release
# - Weekly Monday 9am UTC
# - Manual dispatch
# - PRs (ignoring docs/sites/editor-state changes)

on:
  workflow_run:
    workflows: ["Release Binaries"]
    types: [completed]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'sites/**'
      - '.claude/**'
      - '.vscode/**'
      - '.idea/**'
      - '.editorconfig'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'sites/**'
      - '.claude/**'
      - '.vscode/**'
      - '.idea/**'
      - '.editorconfig'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

# Only the latest run for a given PR/ref keeps going — older runs are cancelled.
concurrency:
  group: e2e-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Matrix shards ──────────────────────────────────────────────────────────
  # Each shard runs the FULL setup but filters e2e to a single suite package.
  # Shards run concurrently; fail-fast: false shows the full picture on failure.
  e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - services
          - platform
          - plugins
          - gateway
          - workflows
          - studio
          - marketplace
          - marketplace-registry
    uses: ./.github/workflows/reusable-e2e-docker.yml
    with:
      suite: ${{ matrix.suite }}
      e2e-package: "@kb-labs/e2e-${{ matrix.suite }}"
      health-url: http://localhost:4000/ready
      health-steps: 60
      playwright-dir: e2e/plugins
      compose-project: kb-e2e-ci-${{ matrix.suite }}
    permissions:
      contents: read

  # ── Aggregator — single required status check ──────────────────────────────
  # Branch protection points at "Platform E2E". Collapses the 8 matrix shards
  # into one pass/fail. Individual shard checks stay visible for triage and
  # targeted re-runs via the GitHub UI.
  aggregate:
    name: Platform E2E
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check matrix outcome
        run: |
          echo "matrix-result=${{ needs.e2e.result }}"
          if [ "${{ needs.e2e.result }}" = "success" ]; then
            echo "All 8 E2E shards passed."
            exit 0
          fi
          echo "::error::At least one E2E shard did not succeed (matrix result: ${{ needs.e2e.result }})."
          exit 1
