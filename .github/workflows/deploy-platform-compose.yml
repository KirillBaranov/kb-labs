name: Deploy platform Compose

# Deliberately separate from the legacy kb-deploy workflow. This is the
# manual migration path for a host that runs the published per-service images.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production
          - stage
          - dev
      version:
        description: Release tag for production, or dev-/stage-prefixed tag for non-production
        required: true
        type: string
      ref:
        description: Git ref containing the Dockerfiles and compose definition
        required: true
        default: master
        type: string
      deploy:
        description: Pull images and restart the remote Compose stack
        required: true
        default: true
        type: boolean
      cleanup:
        description: Remove old KB Labs platform image tags after a healthy deploy
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-platform-compose
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare consumer composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: tools/kb-create/go.mod
      - name: Install composition metadata dependencies
        run: pnpm install --frozen-lockfile
      - name: Build kb-create
        run: make build -C tools/kb-create
      - name: Export consumer image contexts
        run: |
          set -euo pipefail
          mkdir -p .kb/consumer
          for service in gateway rest-api workflow marketplace-registry; do
            ./tools/kb-create/kb-create deployment \
              --matrix .kb/compatibility.json \
              export --root . --service "$service" \
              --output ".kb/consumer/$service"
            cp tools/kb-create/kb-create ".kb/consumer/$service/kb-create"
          done
      - name: Prepare non-production base images
        if: inputs.environment != 'production'
        run: |
          set -euo pipefail
          pnpm build
          specs=(
            '@kb-labs/core-state-daemon:.kb/deploy/state-daemon'
            '@kb-labs/gateway-app:.kb/deploy/gateway-app'
            '@kb-labs/marketplace-app:.kb/deploy/marketplace-app'
            '@kb-labs/rest-api-app:.kb/deploy/rest-api-app'
            '@kb-labs/studio-app:.kb/deploy/studio-app'
            '@kb-labs/workflow-daemon:.kb/deploy/workflow-daemon'
            '@kb-labs/mcp-app:.kb/deploy/mcp-app'
            '@kb-labs/marketplace-registry-app:.kb/deploy/marketplace-registry-app'
          )
          for spec in "${specs[@]}"; do
            package="${spec%%:*}"
            output="${spec#*:}"
            pnpm deploy --filter "$package" --prod "$output"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.environment != 'production'
        with:
          name: platform-deploy-inputs
          path: .kb/deploy/
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consumer-image-contexts
          path: .kb/consumer/
          retention-days: 1

  publish_base:
    name: Publish base ${{ matrix.image }}:${{ inputs.version }}
    needs: prepare
    if: inputs.environment != 'production'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kb-state-daemon
            dockerfile: plugins/state/daemon/Dockerfile
          - image: kb-gateway
            dockerfile: services/gateway/app/Dockerfile
          - image: kb-marketplace
            dockerfile: plugins/marketplace/daemon/Dockerfile
          - image: kb-rest-api
            dockerfile: services/rest-api/app/Dockerfile
          - image: kb-studio
            dockerfile: studio/app/Dockerfile
          - image: kb-workflow
            dockerfile: plugins/workflow/daemon/Dockerfile
          - image: kb-mcp
            dockerfile: services/mcp/app/Dockerfile
          - image: kb-marketplace-registry
            dockerfile: plugins/marketplace-registry/app/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: platform-deploy-inputs
          path: .kb/deploy/
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/kb-labs-team/${{ matrix.image }}:${{ inputs.version }}

  publish_consumer:
    name: Publish consumer ${{ matrix.image }}:${{ inputs.version }}
    needs: [prepare, publish_base]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (inputs.environment == 'production' || needs.publish_base.result == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kb-consumer-gateway
            service: gateway
            base: kb-gateway
          - image: kb-consumer-rest-api
            service: rest-api
            base: kb-rest-api
          - image: kb-consumer-workflow
            service: workflow
            base: kb-workflow
          - image: kb-consumer-marketplace-registry
            service: marketplace-registry
            base: kb-marketplace-registry
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: consumer-image-contexts
          path: .kb/consumer/
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish derived consumer image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .kb/consumer/${{ matrix.service }}
          file: .kb/consumer/${{ matrix.service }}/Dockerfile
          push: true
          build-args: |
            KB_BASE_IMAGE=ghcr.io/kb-labs-team/${{ matrix.base }}:${{ inputs.version }}
          tags: ghcr.io/kb-labs-team/${{ matrix.image }}:${{ inputs.version }}

  deploy:
    name: Deploy Compose stack
    needs: [prepare, publish_base, publish_consumer]
    if: >-
      always() && inputs.deploy &&
      needs.prepare.result == 'success' &&
      (inputs.environment == 'production' || needs.publish_base.result == 'success') &&
      needs.publish_consumer.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy.key
          chmod 600 ~/.ssh/deploy.key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload Compose definition
        run: |
          scp -i ~/.ssh/deploy.key -o StrictHostKeyChecking=accept-new \
            infra/docker-compose.backend.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/kb-labs/docker-compose.platform.yml"
      - name: Upload image cleanup script
        run: |
          scp -i ~/.ssh/deploy.key -o StrictHostKeyChecking=accept-new \
            infra/scripts/cleanup-platform-images.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/kb-labs/cleanup-platform-images.sh"
      - name: Pull and restart platform
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          VERSION: ${{ inputs.version }}
          CLEANUP: ${{ inputs.cleanup }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy.key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "GHCR_TOKEN='$GHCR_TOKEN' VERSION='$VERSION' CLEANUP='$CLEANUP' ENVIRONMENT='$ENVIRONMENT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/kb-labs"

          case "$ENVIRONMENT" in
            production) image_scope=release ;;
            stage) image_scope=stage ;;
            dev) image_scope=dev ;;
            *) echo "unsupported environment: $ENVIRONMENT" >&2; exit 1 ;;
          esac
          if [[ "$ENVIRONMENT" != production && "$VERSION" != "$image_scope-"* ]]; then
            echo "non-production image tag must start with $image_scope-: $VERSION" >&2
            exit 1
          fi

          # Keep the existing host .env and preserve credentials that were
          # supplied only to the running MinIO container by the old stack.
          if ! grep -q '^MINIO_ROOT_USER=' .env 2>/dev/null; then
            user="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' kb-minio 2>/dev/null | sed -n 's/^MINIO_ROOT_USER=//p' | head -1)"
            pass="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' kb-minio 2>/dev/null | sed -n 's/^MINIO_ROOT_PASSWORD=//p' | head -1)"
            {
              printf 'MINIO_ROOT_USER=%s\n' "$user"
              printf 'MINIO_ROOT_PASSWORD=%s\n' "$pass"
            } > .env.platform
          else
            : > .env.platform
          fi
          printf 'BASE_IMAGE_TAG=%s\nCONSUMER_IMAGE_TAG=%s\nCONSUMER_IMAGE_REGISTRY=ghcr.io/kb-labs-team\nKB_REGISTRY_URL=http://kb-marketplace-registry:5071/api/v1\n' "$VERSION" "$VERSION" >> .env.platform

          if [[ "$CLEANUP" == "true" ]]; then
            echo 'Docker usage before platform image cleanup:'
            docker system df
            # Free space before pulling the next release, while retaining the
            # newest existing tag as a rollback image. This is scoped to the
            # eight KB Labs repositories; unrelated host applications and
            # volumes are never pruned.
            bash ./cleanup-platform-images.sh "$VERSION" --apply "$image_scope"
            echo 'Docker usage after platform image cleanup:'
            docker system df
          fi

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u github-actions --password-stdin >/dev/null
          docker compose --env-file .env --env-file .env.platform -f docker-compose.platform.yml pull \
            kb-state-daemon kb-marketplace-registry kb-marketplace kb-gateway \
            kb-rest-api kb-workflow kb-mcp kb-studio
          docker compose --env-file .env --env-file .env.platform -f docker-compose.platform.yml up -d --remove-orphans
          docker compose --env-file .env --env-file .env.platform -f docker-compose.platform.yml ps

          check() { curl -fsS --max-time 15 "$2" >/dev/null || { echo "health check failed: $1" >&2; return 1; }; }
          healthy=false
          for i in 1 2 3 4 5 6; do
            if check gateway http://127.0.0.1:4000/health \
              && check rest http://127.0.0.1:5050/api/v1/health \
              && check workflow http://127.0.0.1:7778/health \
              && check marketplace http://127.0.0.1:5070/health \
              && check registry http://127.0.0.1:5071/health \
              && check state http://127.0.0.1:7777/health \
              && check studio http://127.0.0.1:3002/; then
              healthy=true
              break
            fi
            sleep 10
          done
          docker compose --env-file .env --env-file .env.platform -f docker-compose.platform.yml ps
          if [[ "$healthy" != "true" ]]; then
            exit 1
          fi

          if [[ "$CLEANUP" == "true" ]]; then
            bash ./cleanup-platform-images.sh "$VERSION" --apply "$image_scope"
            echo 'Docker usage after successful platform deploy:'
            docker system df
          fi
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy.key
