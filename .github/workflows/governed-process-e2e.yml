name: Governed process Linux e2e

on:
  pull_request:
    paths:
      - 'core/platform/**'
      - 'core/ipc/**'
      - 'core/plugin-runtime/**'
      - 'core/plugin-execution-factory/**'
      - '.github/workflows/governed-process-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'core/platform/**'
      - 'core/ipc/**'
      - 'core/plugin-runtime/**'
      - 'core/plugin-execution-factory/**'
      - '.github/workflows/governed-process-e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: governed-process-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tools:
    name: Build Go tools
    uses: ./.github/workflows/build-go-tools.yml
    permissions:
      contents: read

  linux-process-e2e:
    runs-on: ubuntu-latest
    needs: build-tools
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev tools/kb-dev/kb-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build process execution dependencies
        run: ./tools/kb-devkit/kb-devkit run build --affected
      - name: Run Linux process and IPC e2e
        run: |
          sudo -E env "PATH=$PATH" pnpm --filter @kb-labs/plugin-runtime exec vitest run \
            src/__tests__/linux-process.e2e.test.ts \
            src/__tests__/governed-shell.test.ts
          pnpm --filter @kb-labs/core-ipc exec vitest run \
            src/__tests__/process-executor-proxy.test.ts \
            src/__tests__/unix-socket-server.test.ts
