name: E2E Marketplace Tests

# Focused suite for plugins/marketplace (:5070) e2e coverage.
# Uses the shared reusable-e2e-docker workflow for the full
# build → Verdaccio → platform → test pipeline.
#
# Triggers:
# - After every CI run on main (post-merge validation)
# - Manual dispatch

on:
  workflow_call:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-marketplace-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Marketplace
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/reusable-e2e-docker.yml
    with:
      suite: marketplace
      e2e-package: "@kb-labs/e2e-marketplace"
      health-url: http://localhost:5070/health
      health-steps: 36
      compose-project: kb-e2e-marketplace
    permissions:
      contents: read
