name: E2E Marketplace Tests

# Focused suite for plugins/marketplace (:5070) e2e coverage.
# Runs the same Docker-based setup as e2e-platform.yml but targets
# only @kb-labs/e2e-marketplace — fast feedback on marketplace changes.
#
# Triggers:
# - Any PR that touches marketplace plugin or the e2e suite itself
# - Manual dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'plugins/marketplace/**'
      - 'e2e/marketplace/**'
      - '.github/workflows/e2e-marketplace.yml'
  workflow_dispatch:

concurrency:
  group: e2e-marketplace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      COMPOSE_FILE: e2e/docker-compose.yml:e2e/docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: kb-e2e-marketplace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build toolchain ──────────────────────────────────────────────────

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/kb-create/go.mod
          cache-dependency-path: |
            tools/kb-create/go.sum
            tools/kb-dev/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # ── Compile Go tools for linux/amd64 ────────────────────────────────

      - name: Build Go tools (kb-devkit, kb-dev)
        run: |
          (cd tools/kb-devkit && CGO_ENABLED=0 go build -o kb-devkit . && chmod +x kb-devkit)
          (cd tools/kb-dev    && CGO_ENABLED=0 go build -o kb-dev    . && chmod +x kb-dev)

      # ── Install + build monorepo ─────────────────────────────────────────

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore kb-devkit build cache
        uses: actions/cache@v4
        with:
          path: .kb/devkit/
          key: devkit-build-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'devkit.yaml', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            devkit-build-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'devkit.yaml', 'tsconfig*.json') }}-
            devkit-build-${{ runner.os }}-

      - name: Build all packages
        run: |
          cp tools/kb-devkit/kb-devkit .
          ./kb-devkit run build 2>&1 | tee /tmp/build.log
          tail -5 /tmp/build.log

      - name: Pack .tgz for Verdaccio
        run: bash e2e/scripts/pack-all.sh 2>&1 | tail -20

      - name: Restore packed .tgz cache
        uses: actions/cache@v4
        with:
          path: e2e/packages/
          key: e2e-tgz-${{ runner.os }}-${{ github.sha }}
          # No restore-keys: only exact sha match is safe.
          # Using a previous sha's tgzs would restore stale binaries and break
          # tests that depend on source changes (e.g. fixes in marketplace-core).

      # ── Build Docker images ───────────────────────────────────────────────

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers (platform)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-platform
          key: buildx-platform-${{ runner.os }}-${{ hashFiles('e2e/platform/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            buildx-platform-${{ runner.os }}-${{ hashFiles('e2e/platform/Dockerfile') }}-
            buildx-platform-${{ runner.os }}-

      - name: Cache Docker layers (publisher)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-publisher
          key: buildx-publisher-${{ runner.os }}-${{ hashFiles('e2e/publisher/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            buildx-publisher-${{ runner.os }}-${{ hashFiles('e2e/publisher/Dockerfile') }}-
            buildx-publisher-${{ runner.os }}-

      - name: Build platform image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache-platform \
            --cache-to   type=local,dest=/tmp/.buildx-cache-platform,mode=max \
            --load \
            -t kb-e2e-ci-platform:latest \
            -f e2e/platform/Dockerfile .

      - name: Build publisher image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache-publisher \
            --cache-to   type=local,dest=/tmp/.buildx-cache-publisher,mode=max \
            --load \
            -t kb-e2e-ci-publisher:latest \
            -f e2e/publisher/Dockerfile \
            e2e/

      # ── Start infrastructure ─────────────────────────────────────────────

      - name: Restore Verdaccio storage cache
        id: verdaccio-cache
        uses: actions/cache@v4
        with:
          path: e2e/.verdaccio-storage
          key: verdaccio-storage-${{ runner.os }}-${{ hashFiles('e2e/packages/**/*.tgz') }}
          restore-keys: |
            verdaccio-storage-${{ runner.os }}-

      - name: Prepare Verdaccio storage permissions
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio
        run: |
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q "healthy"; then
              echo "Verdaccio healthy after $((i * 2))s"; break
            fi
            sleep 2
          done

      - name: Publish packages to Verdaccio
        if: steps.verdaccio-cache.outputs.cache-hit != 'true'
        run: docker compose run --rm publisher

      - name: Confirm Verdaccio warm cache
        if: steps.verdaccio-cache.outputs.cache-hit == 'true'
        run: |
          tgz_count=$(ls e2e/packages/*.tgz 2>/dev/null | wc -l | tr -d ' ')
          pkg_dirs=$(find e2e/.verdaccio-storage/@kb-labs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          echo "Tarballs: $tgz_count  Verdaccio dirs: $pkg_dirs"
          if [ "$pkg_dirs" -lt "$((tgz_count / 2))" ]; then
            echo "::warning::Storage incomplete, re-publishing"
            docker compose run --rm publisher
          fi

      - name: Start platform
        run: docker compose up -d --no-build platform

      - name: Wait for marketplace to be healthy
        run: |
          echo "Waiting for marketplace (up to 3 min)..."
          for i in $(seq 1 36); do
            if curl -sf http://localhost:5070/health > /dev/null 2>&1; then
              echo "Marketplace ready after $((i * 5))s"; break
            fi
            if [ $i -eq 36 ]; then
              echo "Marketplace failed to start — dumping logs"
              docker compose logs platform | tail -100
              exit 1
            fi
            sleep 5
          done

      # ── Run e2e/marketplace suite ────────────────────────────────────────

      - name: Run Marketplace e2e tests
        run: |
          chmod +x tools/kb-devkit/kb-devkit tools/kb-dev/kb-dev || true
          ./tools/kb-devkit/kb-devkit run e2e --packages "@kb-labs/e2e-marketplace"
        env:
          REST_URL:        http://localhost:5050
          GATEWAY_URL:     http://localhost:4000
          MARKETPLACE_URL: http://localhost:5070
          WORKFLOW_URL:    http://localhost:7778
          STATE_URL:       http://localhost:7777
          CI: "true"

      # ── Artifacts + summary ──────────────────────────────────────────────

      - name: Dump platform logs
        if: always()
        run: |
          mkdir -p /tmp/e2e-logs
          docker compose logs --no-color platform  > /tmp/e2e-logs/platform.log  2>&1 || true
          docker compose logs --no-color verdaccio > /tmp/e2e-logs/verdaccio.log 2>&1 || true
          docker compose ps > /tmp/e2e-logs/ps.txt 2>&1 || true

      - name: Upload platform logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-logs-${{ github.run_id }}
          path: /tmp/e2e-logs/
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-marketplace-${{ github.run_id }}
          path: e2e/marketplace/report/
          retention-days: 14

      - name: Show checklist summary
        if: always()
        run: |
          checklist="e2e/marketplace/report/CHECKLIST.md"
          if [ -f "$checklist" ]; then
            echo "### E2E Marketplace checklist" >> $GITHUB_STEP_SUMMARY
            cat "$checklist" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Restore Verdaccio storage ownership for cache save
        if: always()
        run: |
          if [ -d e2e/.verdaccio-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage
          fi
