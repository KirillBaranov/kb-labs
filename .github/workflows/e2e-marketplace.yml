name: E2E Marketplace Tests

# Focused suite for plugins/marketplace (:5070) e2e coverage.
# Uses the shared reusable-e2e-docker workflow for the full
# build → Verdaccio → platform → test pipeline.
#
# Triggers:
# - Any PR that touches marketplace plugin or the e2e suite itself
# - Manual dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'plugins/marketplace/**'
      - 'e2e/marketplace/**'
      - '.github/workflows/e2e-marketplace.yml'
  workflow_dispatch:

concurrency:
  group: e2e-marketplace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Marketplace
    uses: ./.github/workflows/reusable-e2e-docker.yml
    with:
      suite: marketplace
      e2e-package: "@kb-labs/e2e-marketplace"
      health-url: http://localhost:5070/health
      health-steps: 36
      compose-project: kb-e2e-marketplace
    permissions:
      contents: read
