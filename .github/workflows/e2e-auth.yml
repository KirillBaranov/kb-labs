name: E2E Auth Tests

# 33 mandatory acceptance scenarios for Studio auth (ADR-0020, Phase 4).
# Runs against a local Docker platform (gateway :4000) + Studio served by nginx (:4001).
#
# Triggers:
# - After every CI run on main (post-merge validation)
# - Manual dispatch

on:
  workflow_call:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-auth-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/reusable-e2e-playwright.yml
    with:
      suite: auth
      compose-files: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.auth-ci.yml
      compose-project: kb-e2e-auth
      run-command: cd e2e/auth && pnpm e2e
      report-dir: e2e/auth/report
      artifact-prefix: auth
      studio: true
      studio-https: false
      idp: false
    permissions:
      contents: read
