name: E2E OAuth/OIDC Tests

# OAuth/OIDC redirect-login acceptance (ADR-0020 Step 6 + identity-provider v2).
# Exercises the full authorization-code round-trip against idp-stub.
#
# Triggers:
# - After every CI run on main (post-merge validation)
# - Manual dispatch

on:
  workflow_call:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-oauth-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/reusable-e2e-playwright.yml
    with:
      suite: oauth
      compose-files: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.auth-ci.yml:e2e/docker-compose.oauth-ci.yml
      compose-project: kb-e2e-oauth
      run-command: cd e2e/auth && pnpm e2e:oauth
      report-dir: e2e/auth/report-oauth
      artifact-prefix: oauth
      studio: true
      studio-https: true
      idp: true
      hosts-entry: "127.0.0.1 kb-cloud.kblabs.ru"
    permissions:
      contents: read
