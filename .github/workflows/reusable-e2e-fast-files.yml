name: Reusable — Prepare fast E2E files

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Fast E2E / build files once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/kb-create/go.mod
          cache-dependency-path: tools/kb-devkit/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build Go tools
        run: |
          (cd tools/kb-devkit && CGO_ENABLED=0 go build -o kb-devkit . && chmod +x kb-devkit)
          (cd tools/kb-dev && CGO_ENABLED=0 go build -o kb-dev . && chmod +x kb-dev)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore fast E2E build cache
        uses: actions/cache@v4
        with:
          path: .kb/devkit/
          key: fast-e2e-devkit-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'devkit.yaml', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            fast-e2e-devkit-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'devkit.yaml', 'tsconfig*.json') }}-
      - name: Build packages once
        run: pnpm build
      - name: Pack packages once
        run: bash e2e/scripts/pack-all.sh
      - name: Create files bundle
        run: |
          find . -path '*/node_modules/*' -prune -o -type d -name dist -print > /tmp/dist-paths
          tar czf /tmp/e2e-files.tar.gz \
            .kb/devkit \
            tools/kb-devkit/kb-devkit \
            tools/kb-dev/kb-dev \
            e2e/packages \
            -T /tmp/dist-paths
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: /tmp/e2e-files.tar.gz
          retention-days: 1
          compression-level: 0
