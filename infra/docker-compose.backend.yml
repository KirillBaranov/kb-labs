services:
  kb-redis:
    image: redis:7-alpine
    container_name: kb-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: &kb-json-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - kb-backend

  kb-minio:
    image: minio/minio:latest
    container_name: kb-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    logging: *kb-json-logging
    networks:
      - kb-backend

  kb-state-daemon:
    image: ${KB_IMAGE_REGISTRY:-ghcr.io/kb-labs-team}/kb-state-daemon:${BASE_IMAGE_TAG:?set BASE_IMAGE_TAG to an explicit release version}
    container_name: kb-state-daemon
    ports:
      - "7777:7777"
    # No adapters, no persistence (InMemoryStateBroker) — see plugins/state/daemon/Dockerfile.
    # A restart wipes any in-flight locks; that is current, expected behaviour.
    restart: unless-stopped
    logging: *kb-json-logging
    networks:
      - kb-backend

  kb-marketplace-registry:
    image: ${CONSUMER_IMAGE_REGISTRY:-ghcr.io/kb-labs-team}/kb-consumer-marketplace-registry:${CONSUMER_IMAGE_TAG:?set CONSUMER_IMAGE_TAG to a derived image tag}
    container_name: kb-marketplace-registry
    ports:
      - "5071:5071"
    environment:
      - NODE_ENV=production
      - KB_REGISTRY_URL=${KB_REGISTRY_URL:?set KB_REGISTRY_URL to your self-hosted registry URL}
      - KB_REGISTRY_PORT=5071
      - KB_SITE_URL=${KB_SITE_URL:-https://kblabs.ru}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      - kb-redis
      - kb-minio
      # plugins/marketplace-registry/README.md:44 — real runtime dependency, not dev-only.
      - kb-state-daemon
    restart: unless-stopped
    logging: *kb-json-logging
    networks:
      - kb-backend

  kb-marketplace:
    image: ${KB_IMAGE_REGISTRY:-ghcr.io/kb-labs-team}/kb-marketplace:${BASE_IMAGE_TAG:?set BASE_IMAGE_TAG to an explicit release version}
    container_name: kb-marketplace
    ports:
      - "5070:5070"
    environment:
      - NODE_ENV=production
      # Consumer-side daemon (distinct from kb-marketplace-registry, the
      # publisher/storage service). Points at your own registry, not any
      # KB Labs default — see plugins/marketplace/daemon/Dockerfile.
      - KB_REGISTRY_URL=http://kb-marketplace-registry:5071/api/v1
    depends_on:
      - kb-marketplace-registry
    restart: unless-stopped
    logging: *kb-json-logging
    networks:
      - kb-backend

  kb-gateway:
    image: ${CONSUMER_IMAGE_REGISTRY:-ghcr.io/kb-labs-team}/kb-consumer-gateway:${CONSUMER_IMAGE_TAG:?set CONSUMER_IMAGE_TAG to a derived image tag}
    container_name: kb-gateway
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
    volumes:
      - gateway_data:/app/.kb/database
      - gateway_storage:/app/.kb/storage
      - gateway_analytics:/app/.kb/analytics
    depends_on:
      - kb-redis
    restart: unless-stopped
    logging: *kb-json-logging
    networks:
      - kb-backend

  kb-rest-api:
    image: ${CONSUMER_IMAGE_REGISTRY:-ghcr.io/kb-labs-team}/kb-consumer-rest-api:${CONSUMER_IMAGE_TAG:?set CONSUMER_IMAGE_TAG to a derived image tag}
    container_name: kb-rest-api
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=production
    depends_on:
      - kb-redis
    restart: unless-stopped
    logging: *kb-json-logging
    networks:
      - kb-backend

  kb-workflow:
    image: ${CONSUMER_IMAGE_REGISTRY:-ghcr.io/kb-labs-team}/kb-consumer-workflow:${CONSUMER_IMAGE_TAG:?set CONSUMER_IMAGE_TAG to a derived image tag}
    container_name: kb-workflow
    ports:
      - "7778:7778"
    environment:
      - NODE_ENV=production
    volumes:
      - workflow_analytics:/app/.kb/analytics
    depends_on:
      - kb-redis
    restart: unless-stopped
    logging: *kb-json-logging
    networks:
      - kb-backend
    # IMPORTANT: exactly one instance. JobBroker/CronScheduler run in-process
    # (plugins/workflow/daemon/src/bootstrap.ts) — a second instance
    # double-fires every scheduled job. See docs/adr/0037.
    deploy:
      replicas: 1

  kb-mcp:
    image: ${KB_IMAGE_REGISTRY:-ghcr.io/kb-labs-team}/kb-mcp:${BASE_IMAGE_TAG:?set BASE_IMAGE_TAG to an explicit release version}
    container_name: kb-mcp
    ports:
      - "7779:7779"
    environment:
      - NODE_ENV=production
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
    restart: unless-stopped
    logging: *kb-json-logging
    networks:
      - kb-backend

  kb-studio:
    image: ${KB_IMAGE_REGISTRY:-ghcr.io/kb-labs-team}/kb-studio:${BASE_IMAGE_TAG:?set BASE_IMAGE_TAG to an explicit release version}
    container_name: kb-studio
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - KB_API_BASE_URL=http://kb-gateway:4000/api/v1
    depends_on:
      - kb-gateway
    restart: unless-stopped
    logging: *kb-json-logging
    networks:
      - kb-backend

networks:
  kb-backend:
    name: kb-backend

volumes:
  redis_data:
  gateway_data:
  gateway_storage:
  gateway_analytics:
  workflow_analytics:
  minio_data:
