services:
  kb-redis:
    image: redis:7-alpine
    container_name: kb-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - kb-backend

  kb-minio:
    image: minio/minio:latest
    container_name: kb-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - kb-backend

  kb-marketplace-registry:
    image: ghcr.io/kirillbaranov/kb-marketplace-registry:${IMAGE_TAG:-latest}
    container_name: kb-marketplace-registry
    environment:
      - NODE_ENV=production
      - KB_REGISTRY_URL=${KB_REGISTRY_URL:-https://api.kblabs.ru/api/v1/registry}
      - KB_REGISTRY_PORT=5071
      - KB_SITE_URL=${KB_SITE_URL:-https://kblabs.ru}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      - kb-redis
      - kb-minio
    restart: unless-stopped
    networks:
      - kb-backend

  kb-gateway:
    image: ghcr.io/kirillbaranov/kb-gateway:${IMAGE_TAG:-latest}
    container_name: kb-gateway
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
    volumes:
      - gateway_data:/app/.kb/database
    depends_on:
      - kb-redis
    restart: unless-stopped
    networks:
      - kb-backend

networks:
  kb-backend:
    name: kb-backend

volumes:
  redis_data:
  gateway_data:
  minio_data:
