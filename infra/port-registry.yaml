# ──────────────────────────────────────────────────────────────────────────────
# KB Labs Port Registry
# ──────────────────────────────────────────────────────────────────────────────
# Single source of truth for port RANGES and PRODUCTION deployment metadata.
#
# Runtime port assignments live in `.kb/devservices.yaml` (prod runtime) and
# `.kb/devservices.dev.yaml` (dev runtime) — this file does NOT duplicate them.
# It defines which numeric range each service class belongs to, and the prod
# deployment contract that `scripts/checks/check-ports.mjs` cross-validates
# against `infra/docker-compose.backend.yml` and `.github/workflows/deploy.yml`.
#
# See ADR-0024 for the full policy. The glossary at `docs/ports.md` is generated
# from this file + devservices — run `pnpm ports:generate` after any change.
# ──────────────────────────────────────────────────────────────────────────────

version: 1

ranges:
  frontend:
    from: 3000
    to: 3999
    description: "UI/frontend services served directly to browsers"
    criteria: >
      End consumer is a browser, not another service.
      Sits behind nginx in production (80/443). No backend business logic.

  gateway:
    from: 4000
    to: 4099
    description: "API gateways — single entry point for all external traffic"
    criteria: >
      Routes external traffic to other services; contains no business logic itself.
      Exposed to the outside world (ports: in compose). Remove it and external requests stop.

  test:
    from: 4100
    to: 4999
    description: "Test infrastructure — CI/e2e only, never in production"
    criteria: >
      Only exists in CI or e2e environments.
      Not listed in the primary devservices.yaml.

  services:
    from: 5000
    to: 5999
    description: "Application HTTP services with business logic"
    criteria: >
      Primary interface is an HTTP API (REST/GraphQL).
      Contains business logic. Can be dev-only or prod.

  daemons:
    from: 7000
    to: 7999
    description: "Internal background daemons — HTTP is auxiliary only"
    criteria: >
      Primary work is background processing (state, events, orchestration).
      HTTP exists only for health checks or management. Removing HTTP does not stop core work.

  infra:
    from: 9000
    to: 9999
    description: "External infrastructure dependencies — third-party services"
    criteria: >
      Third-party service (Redis, MinIO, Qdrant, etc.).
      KB Labs code connects to it; we do not own it.

# ──────────────────────────────────────────────────────────────────────────────
# Decision tree — how to pick a range for a new service (also in ADR-0024)
#
#   Serves HTML to browsers?             → frontend  (3000)
#   Routes external traffic?             → gateway   (4000)
#   CI/e2e environment only?             → test      (4100)
#   Third-party infrastructure?          → infra     (9000)
#   HTTP is auxiliary (health/mgmt)?     → daemons   (7000)
#   Otherwise                            → services  (5000)
# ──────────────────────────────────────────────────────────────────────────────

# Exceptions — ports that intentionally sit outside the ranges above.
# Each must carry a reason. check-ports.mjs treats these as allowed.
exceptions:
  - port: 6333
    service: qdrant
    reason: "Qdrant vendor-fixed default port (infra, dev-only)"
  - port: 6379
    service: redis
    reason: "Redis vendor-fixed default port (infra, dev-only)"
  - port: 20128
    service: omniroute
    reason: "OmniRoute vendor-fixed default port (ai, optional, dev-only)"

# ──────────────────────────────────────────────────────────────────────────────
# Production deployment contract
# Cross-validated by check-ports.mjs against:
#   - infra/docker-compose.backend.yml  (compose:true → matching `ports:` + container_name)
#   - .github/workflows/deploy.yml      (each must have a smoke test at the same port + path)
#
# `runtime_service` links a prod entry to its `.kb/devservices*.yaml` name so scope
# attribution and cross-checks key off identity, not a coincidental shared port.
# (kb-web runs on 3010 in dev to avoid colliding with studio on 3000 — the prod
# port 3000 is intentionally different and must not be matched by number.)
# `container` must equal the running container name (see .kb/deploy.yaml container_name).
# ──────────────────────────────────────────────────────────────────────────────

prod:
  - service: kb-web
    runtime_service: kb-web
    port: 3000
    container: kb-labs-web
    smoke_path: /
    # Built and pushed as a Docker image; deployed via docker-compose.yml, not backend
    compose: false

  - service: kb-docs
    runtime_service: kb-docs
    port: 3001
    container: kb-labs-docs
    smoke_path: /
    compose: false

  - service: kb-gateway
    runtime_service: gateway
    port: 4000
    container: kb-gateway
    compose_service: kb-gateway
    smoke_path: /health
    compose: true

  - service: kb-marketplace-registry
    runtime_service: marketplace-registry
    port: 5071
    container: kb-marketplace-registry
    compose_service: kb-marketplace-registry
    smoke_path: /health
    compose: true
