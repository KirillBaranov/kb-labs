# Global maps for KB Labs nginx. Deploy to /etc/nginx/conf.d/kb-maps.conf
# so it's loaded at http {} level (required by snippets that reference
# $connection_upgrade and $kb_error_page).

# Standard nginx WebSocket pattern.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Pick branded error page format based on what the client accepts.
# API clients usually send Accept: application/json — give them JSON,
# browsers get HTML.
map $http_accept $kb_error_page {
    default              /__errors/5xx.html;
    "~*application/json" /__errors/5xx.json;
}
