# Common proxy headers for any KB Labs upstream.
# Include inside a `location` block.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_cache_bypass $http_upgrade;

# Intercept upstream errors so error_page directives can serve our branded
# pages instead of leaking raw backend responses (stack traces, framework
# defaults, etc).
proxy_intercept_errors on;

# Hide headers that may leak upstream stack details.
proxy_hide_header X-Powered-By;
proxy_hide_header X-Runtime;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-Debug-Token;
proxy_hide_header X-Debug-Token-Link;
