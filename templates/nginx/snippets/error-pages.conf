# Branded error pages for KB Labs services. Include inside a `server` block.
#
# Requires the maps from snippets/maps.conf to be loaded at http {} level
# (deploy maps.conf to /etc/nginx/conf.d/).

# Map 5xx codes to a single dispatcher location.
error_page 500 502 503 504 = @kb_5xx;

# Always echo the request id back to the client — useful for support tickets.
add_header X-Request-Id $request_id always;

location @kb_5xx {
    internal;
    # Dispatch to HTML or JSON based on Accept header (see maps.conf).
    rewrite ^ $kb_error_page break;
}

location = /__errors/5xx.html {
    internal;
    root /var/www/kb-errors;
    rewrite ^/__errors/(.*)$ /$1 break;
    add_header X-Request-Id  $request_id always;
    add_header Cache-Control "no-store"  always;
}

location = /__errors/5xx.json {
    internal;
    default_type application/json;
    add_header X-Request-Id  $request_id always;
    add_header Cache-Control "no-store"  always;
    return 503 '{"error":"service_unavailable","message":"Service is temporarily unavailable. Please try again shortly.","request_id":"$request_id"}';
}
