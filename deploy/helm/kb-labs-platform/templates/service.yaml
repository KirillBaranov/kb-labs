{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kb-labs-platform.fullname" (dict "Release" $.Release "name" $name) }}
  labels:
    {{- include "kb-labs-platform.labels" (dict "Release" $.Release "name" $name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
  selector:
    {{- include "kb-labs-platform.selectorLabels" (dict "Release" $.Release "name" $name) | nindent 4 }}
{{- end }}
{{- end }}
