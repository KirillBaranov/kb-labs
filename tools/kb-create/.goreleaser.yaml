version: 2

project_name: kb-create

before:
  hooks:
    - go mod tidy

builds:
  - id: kb-create
    main: .
    binary: kb-create
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    # Supported matrix (decision S0.3c): linux and darwin on amd64 and arm64.
    # Windows is dropped in the release control-plane cutover; kb-create
    # rejects an unsupported {os, arch} with a typed diagnostic instead.
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    name_template: "kb-create-{{ .Os }}-{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-snapshot"

changelog:
  disable: true

release:
  draft: true
  replace_existing_draft: true
