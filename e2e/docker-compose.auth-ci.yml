# Docker Compose override for auth E2E CI.
#
# Usage (merge with base docker-compose.yml and docker-compose.ci.yml):
#
#   docker compose \
#     -f e2e/docker-compose.yml \
#     -f e2e/docker-compose.ci.yml \
#     -f e2e/docker-compose.auth-ci.yml \
#     up -d
#
# Adds an nginx container (port 4001) that:
#   - Serves Studio SPA static files from the `studio-dist` volume
#   - Proxies /api/ to the `platform` container (gateway at :4000)
#
# This gives Playwright a single origin for both the UI and the API,
# so SameSite=Strict cookies work correctly end-to-end.
#
# documentDatabase (SQLite) is configured in registry-manifest.json via
# adapterConfig — kb-create wires it into kb.config.jsonc at platform
# bootstrap time. No overlay or runtime restart needed.
#
# Phase 3 (infra) will replace this with the real nginx wildcard config.
# This file is CI-only; local dev uses `kb-dev start` + Vite dev server.

services:
  # Override platform service to inject bootstrap env vars.
  # GATEWAY_BOOTSTRAP_* seeds the admin user on first gateway startup.
  platform:
    environment:
      GATEWAY_BOOTSTRAP_ADMIN_EMAIL: "admin@kb-cloud.test"
      GATEWAY_BOOTSTRAP_ADMIN_PASSWORD: "AdminPass123!"
      GATEWAY_BOOTSTRAP_TENANT_ID: "kb-cloud"
      # Do NOT set AUTH_COOKIE_SECURE=false here. Cookies default to Secure=true, which is
      # correct: Chromium treats http://localhost as a secure origin (by spec) and WILL
      # send Secure-flagged cookies over the loopback interface. This lets AUTH-02 / AUTH-29
      # verify the Secure attribute while keeping cookies functional in the CI HTTP context.
      # Short TTLs needed for session-lifecycle tests (AUTH-06 waits for expiry).
      # The reusable CI workflow sets these env vars only for the pnpm-e2e step,
      # not for the docker compose up step, so we default to the test values here.
      AUTH_ACCESS_TTL_SEC: "${AUTH_ACCESS_TTL_SEC:-5}"
      AUTH_REFRESH_TTL_SEC: "${AUTH_REFRESH_TTL_SEC:-15}"
      AUTH_INVITE_TTL_MS: "${AUTH_INVITE_TTL_MS:-604800000}"
      # Restore production rate-limit defaults for the auth E2E suite. The base
      # docker-compose.yml raises these to 500/200 to avoid false 429s from
      # loginAsAdmin() calls in other E2E suites. The auth suite needs realistic
      # limits so AUTH-27 (per-IP) and AUTH-28 (per-email) can actually trigger
      # 429. This is safe because the rate limiter now only counts FAILED login
      # attempts — successful admin logins never increment the counter.
      AUTH_LOGIN_RATE_LIMIT_PER_IP: "10"
      AUTH_LOGIN_RATE_LIMIT_PER_EMAIL: "5"

  studio:
    image: nginx:1.27-alpine
    depends_on:
      platform:
        condition: service_healthy
    ports:
      - "4001:4001"
    volumes:
      - ../e2e/auth/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - studio-dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/api/auth/providers"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  studio-dist:
    external: false
