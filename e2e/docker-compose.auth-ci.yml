# Docker Compose override for auth E2E CI.
#
# Usage (merge with base docker-compose.yml and docker-compose.ci.yml):
#
#   docker compose \
#     -f e2e/docker-compose.yml \
#     -f e2e/docker-compose.ci.yml \
#     -f e2e/docker-compose.auth-ci.yml \
#     up -d
#
# Adds an nginx container (port 4001) that:
#   - Serves Studio SPA static files from the `studio-dist` volume
#   - Proxies /api/ to the `platform` container (gateway at :4000)
#
# This gives Playwright a single origin for both the UI and the API,
# so SameSite=Strict cookies work correctly end-to-end.
#
# Phase 3 (infra) will replace this with the real nginx wildcard config.
# This file is CI-only; local dev uses `kb-dev start` + Vite dev server.

services:
  studio:
    image: nginx:1.27-alpine
    depends_on:
      platform:
        condition: service_healthy
    ports:
      - "4001:4001"
    volumes:
      - ../e2e/auth/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - studio-dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/api/auth/providers"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  studio-dist:
    external: false
