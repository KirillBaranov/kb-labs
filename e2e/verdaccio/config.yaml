# Verdaccio — local npm registry for E2E tests
#
# All @kb-labs/* packages are published here from the monorepo build.
# All other packages proxy transparently to npmjs.org.
#
# Auth: $all includes $anonymous → no credentials needed to publish.
# This is intentional — Verdaccio runs in an isolated Docker network.

storage: /verdaccio/storage

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: 1000

uplinks:
  npmjs:
    url: https://registry.npmjs.org
    # Large binaries (e.g. @rspack/binding-linux-x64-gnu ~40MB) need more time.
    timeout: 180s
    # Recover quickly from npmjs hiccups instead of staying blocked for minutes.
    # 5m fail_timeout caused cascading 404s for all parallel e2e shards.
    max_fails: 3
    fail_timeout: 15s
    cache: true

packages:
  # Local packages — served ONLY from Verdaccio, no proxy to npmjs.
  # All @kb-labs/* are published by the publisher container before
  # the platform installs. NO proxy so verdaccio doesn't see them
  # as "already present" via npmjs.org uplink.
  '@kb-labs/*':
    access: $all
    publish: $all
    unpublish: $all

  # Everything else transparently from npm
  '**':
    access: $all
    publish: $all
    proxy: npmjs

log:
  type: stdout
  format: pretty
  level: warn

server:
  keepAliveTimeout: 60

max_body_size: 200mb
