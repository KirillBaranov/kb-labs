# nginx config for auth E2E testing.
# Serves Studio SPA from /usr/share/nginx/html and proxies gateway traffic.
# Used by docker-compose.auth-ci.yml — NOT for production (that's Phase 3 / infra).
#
# Two gateway prefixes are proxied:
#   /api/   — new user-auth routes (prefix stripped before forwarding)
#   /auth/  — legacy machine-auth routes (/auth/register, /auth/token, /auth/refresh)
#             forwarded as-is (with prefix) because gateway registers them at /auth/*.

server {
    listen 4001;

    # Security headers (also tested by E2E scenarios 16, 29)
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy all /api/ traffic to gateway container (strips /api/ prefix)
    location /api/ {
        proxy_pass         http://platform:4000/;
        proxy_http_version 1.1;
        # Use the E2E tenant subdomain so the gateway's tenant resolver extracts
        # "kb-cloud" from the Host header. Without this, gateway sees "localhost"
        # → tenant resolver returns null → tenantId = '' → login fails.
        proxy_set_header   Host              "kb-cloud.kblabs.ru";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass cookies through without modification
        proxy_pass_header  Set-Cookie;
    }

    # Proxy legacy machine-auth routes to gateway (keep /auth/ prefix)
    location /auth/ {
        proxy_pass         http://platform:4000/auth/;
        proxy_http_version 1.1;
        # Same tenant-host override — machine-auth routes also need correct Host
        # for consistent tenant resolution across all auth paths.
        proxy_set_header   Host              "kb-cloud.kblabs.ru";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_pass_header  Set-Cookie;
    }

    # Serve Studio SPA (catch-all → index.html for client-side routing)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
