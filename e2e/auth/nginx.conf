# nginx config for auth E2E testing.
# Serves Studio SPA from /usr/share/nginx/html and proxies /api/ to gateway.
# Used by docker-compose.auth-ci.yml — NOT for production (that's Phase 3 / infra).

server {
    listen 4001;

    # Security headers (also tested by E2E scenarios 16, 29)
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy all /api/ traffic to gateway container
    location /api/ {
        proxy_pass         http://platform:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass cookies through without modification
        proxy_pass_header  Set-Cookie;
    }

    # Serve Studio SPA (catch-all → index.html for client-side routing)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
