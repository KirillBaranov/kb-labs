# HTTPS nginx for the OAuth/OIDC auth E2E stack.
#
# Why a TLS origin (unlike the plain-http :4001 used by the other auth specs):
# the gateway builds the OAuth redirect_uri from the request Host + scheme
# (https://kb-cloud.kblabs.ru/api/auth/oauth/corp/callback). That URL leaves
# the gateway and is followed by the *browser* after the IdP login. So the
# browser must reach the studio under exactly that host, over https, with
# Secure cookies actually working — i.e. a real TLS origin named
# kb-cloud.kblabs.ru. The browser maps that name to 127.0.0.1:4443 via
# Chromium host-resolver-rules (see playwright.oauth.config.ts) and trusts the
# self-signed cert via ignoreHTTPSErrors.
#
# Served by the `studio-https` container in docker-compose.oauth-ci.yml. The
# plain-http :4001 server (nginx.conf) is untouched, so the existing auth specs
# keep working.

server {
    listen 4443 ssl;
    server_name kb-cloud.kblabs.ru;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy all /api/ traffic to the gateway (strips the /api/ prefix). The
    # gateway sees the real public Host (kb-cloud.kblabs.ru) so tenant
    # resolution AND the OAuth redirect_uri both come out correct.
    location /api/ {
        proxy_pass         http://platform:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              "kb-cloud.kblabs.ru";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tell the gateway the public scheme is https so Secure cookies + the
        # https redirect_uri are emitted even though the proxy hop is plain http.
        proxy_set_header   X-Forwarded-Proto https;
        proxy_pass_header  Set-Cookie;
    }

    # Legacy machine-auth routes (kept for parity with nginx.conf).
    location /auth/ {
        proxy_pass         http://platform:4000/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              "kb-cloud.kblabs.ru";
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_pass_header  Set-Cookie;
    }

    # Serve Studio SPA (catch-all → index.html for client-side routing).
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
