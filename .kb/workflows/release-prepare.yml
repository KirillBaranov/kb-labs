# Release control-plane step — checks, review, approval and release intent.
# Candidate build, bundle creation, delivery and post-publish smoke run on the
# controlled reusable GitHub workflows dispatched below.
#
# This workflow owns release decisions; CI owns only candidate execution and
# delivery of the exact bundle returned to this state machine.
#
# Run: kb workflow:run --workflow-id workspace:release-prepare --input '{"flow":"platform"}'
#
# Emergency escape hatch: add "skipChecks":true to the input to skip the
# Checks step entirely (e.g. when Checks itself is broken or the pre-release
# gate is what's blocking, not the release content). Packages still get
# built and reviewed — just not gate-checked. Re-run `pnpm kb release checks
# --flow <flow>` by hand afterward and don't treat the release as verified
# until that's green.

name: release-prepare
version: 1.0.0
description: Prepare a release intent with a human approval gate and dispatch an immutable candidate build.
on:
  manual: true

inputs:
  flow:
    type: string
    description: Release flow to prepare — must match a key under release.flows in .kb/kb.config.json (e.g. "platform", "sdk")
    required: true
  channel:
    type: string
    description: >-
      Release channel — "stable" (default) bumps versions, writes the changelog, and
      commits/tags/pushes; nothing is published to npm here, CI publishes off the pushed
      tag. "canary" skips version bump/changelog/git entirely and instead publishes
      straight to real npm under the canary dist-tag as part of this workflow, gated by
      the same approval step — there is no CI leg for canary, so approving IS the publish.
    required: false
    default: stable
  skipChecks:
    type: boolean
    description: Skip the pre-release Checks step (dist-exports/pack-install/typecheck/lint/tests). Escape hatch for shipping when Checks itself is broken/too slow — the packages still get built and reviewed, just not gate-checked. Re-run checks manually before trusting the release.
    required: false
    default: false
phases:
  preview:
    label: Preview
    description: Compute the release plan (no side effects)
  checks:
    label: Checks
    description: Run configured pre-release checks
  build:
    label: Build
    description: Build packages included in the release
  approval:
    label: Approval
    description: Human sign-off after the complete release review package is ready
  prepare:
    label: Prepare
    description: Update package versions after approval
  git:
    label: Git
    description: Commit, tag, and push the prepared release

jobs:
  prepare:
    runsOn: local
    steps:
      - name: Verify release branch
        id: branch
        phase: preview
        run: |
          set -e
          branch="$(git branch --show-current)"
          if [ "$branch" != "master" ]; then
            echo "Release preparation is allowed only from master (current branch: ${branch:-detached})" >&2
            exit 1
          fi

      - name: Preview
        id: plan
        phase: preview
        timeoutMs: 1200000
        run: pnpm kb release plan --flow ${{ inputs.flow }} --channel ${{ inputs.channel }}

      - name: Checks
        id: checks
        phase: checks
        # pack-install runs a real `npm pack` + clean-consumer `npm install` per package
        # (~140 packages). At the process-broker's safe concurrency (CHECKS_CONCURRENCY=2,
        # see plugins/release/manager-core/src/checks.ts) a full run is install-heavy and
        # can grow with the monorepo; keep a two-hour budget for future package growth.
        timeoutMs: 7200000
        if: ${{ !inputs.skipChecks }}
        run: pnpm kb release checks --flow ${{ inputs.flow }} --json

      - name: Build
        id: build
        phase: build
        # Full platform flow (~140 packages) can exceed 20min; keep a two-hour
        # budget for future package growth and build-order expansion.
        timeoutMs: 7200000
        run: pnpm kb release build --flow ${{ inputs.flow }} --json

      - name: Prepare release review
        id: review
        phase: approval
        timeoutMs: 1200000
        env:
          RELEASE_FLOW: "${{ inputs.flow }}"
          RELEASE_PLAN_PATH: "${{ steps.plan.outputs.planPath }}"
        artifacts:
          releaseReview:
            type: markdown
            source: steps.review.outputs.review
            label: Release review
            showInSummary: true
          releasePlan:
            type: json
            source: steps.review.outputs.plan
            label: Release plan
            showInSummary: true
          releaseChangelog:
            type: markdown
            source: steps.review.outputs.changelog
            label: Changelog
            showInSummary: true
          releaseCompare:
            type: link
            source: steps.review.outputs.compareUrl
            label: Changes since previous release
            showInSummary: true
          releaseTag:
            type: link
            source: steps.review.outputs.tagUrl
            label: Release tag
            showInSummary: true
        run: |
          set -e
          if [ "${{ inputs.channel }}" = "stable" ]; then
            pnpm kb release changelog --flow ${{ inputs.flow }}
          fi
          RELEASE_CHANNEL="${{ inputs.channel }}" node .kb/workflows/scripts/release-review-artifacts.mjs

      - name: Confirm release
        phase: approval
        uses: builtin:approval
        with:
          title: "Release ${{ inputs.flow }} (${{ inputs.channel }}) — proceed?"
          instructions: "Review the release plan, package links, and check/build results above. channel=stable: approving versions, tags, and pushes the release — nothing is published to npm here, that happens in CI off the pushed tag. channel=canary: approving publishes straight to real npm under the canary dist-tag as the very next step in this workflow — there is no later gate. skipChecks=${{ inputs.skipChecks }} (if true, pack-install/typecheck/lint/tests did NOT run — verify manually before approving)."

      - name: Bump versions
        id: version
        phase: prepare
        if: ${{ inputs.channel == 'stable' }}
        timeoutMs: 1200000
        run: pnpm kb release version --flow ${{ inputs.flow }} --json

      - name: Verify release branch before git operations
        id: git-branch
        phase: git
        if: ${{ inputs.channel == 'stable' }}
        run: |
          set -e
          branch="$(git branch --show-current)"
          if [ "$branch" != "master" ]; then
            echo "Refusing to create release commit or tag outside master (current branch: ${branch:-detached})" >&2
            exit 1
          fi

      - name: Commit and tag
        id: git
        phase: git
        if: ${{ inputs.channel == 'stable' }}
        timeoutMs: 1200000
        run: pnpm kb release git --flow ${{ inputs.flow }} --bump auto --json

      - name: Build immutable candidate in controlled CI
        id: candidate
        phase: git
        timeoutMs: 7200000
        run: |
          set -euo pipefail
          version='${{ steps.plan.outputs.version }}'
          test -n "$version"
          candidate_id="${{ inputs.flow }}-${version}-${{ inputs.channel }}-$(date -u +%Y%m%dT%H%M%SZ)"
          node .kb/workflows/scripts/dispatch-release-candidate.mjs \
            --candidate-id "$candidate_id" \
            --commit "$(git rev-parse HEAD)" \
            --flow '${{ inputs.flow }}' \
            --version "$version" \
            --channel '${{ inputs.channel }}' \
            --repository "${GITHUB_REPOSITORY:-kb-labs-team/kb-labs}"
