# Release control-plane step — checks, review, approval and release intent.
# Candidate build, bundle creation, delivery and post-publish smoke run on the
# controlled reusable GitHub workflows dispatched below. The local control
# plane does not pre-build bytes that CI will discard and rebuild.
#
# This workflow owns release decisions; CI owns only candidate execution and
# delivery of the exact bundle returned to this state machine.
#
# Run: kb workflow:run --workflow-id workspace:release-prepare --input '{"flow":"platform"}'
#
# Emergency escape hatch: add "skipChecks":true to the input to skip the
# Checks step entirely (e.g. when Checks itself is broken or the pre-release
# gate is what's blocking, not the release content). Packages still get
# built and reviewed — just not gate-checked. Re-run `pnpm kb release checks
# --flow <flow>` by hand afterward and don't treat the release as verified
# until that's green.

name: release-prepare
version: 1.0.0
description: Prepare a release intent with a human approval gate and dispatch an immutable candidate build.
on:
  manual: true

inputs:
  flow:
    type: string
    description: Release flow to prepare — must match a key under release.flows in .kb/kb.config.json (e.g. "platform", "sdk")
    required: true
  channel:
    type: string
    description: >-
      Release channel — "stable" (default) bumps versions, writes the changelog, and
      commits/tags/pushes. "canary" skips those Git mutations. Both channels always
      build an immutable candidate in CI; neither becomes installable until a separate
      promotion succeeds after delivery and smoke.
    required: false
    default: stable
  skipChecks:
    type: boolean
    description: Skip the pre-release Checks step (dist-exports/pack-install/typecheck/lint/tests). Escape hatch for shipping when Checks itself is broken/too slow — the packages still get built and reviewed, just not gate-checked. Re-run checks manually before trusting the release.
    required: false
    default: false
  bump:
    type: string
    description: >-
      Version bump override — "auto" (default) infers patch/minor/major from
      conventional commits since the last tag; force "major" for a deliberate
      breaking release regardless of what commit messages say. This only
      changes the version number: the compatibility matrix in each release's
      release-index.json already relates platform/SDK/binary versions by
      exact, explicit pairs (tools/kb-create/v2/catalog/catalog.go,
      CheckCompatibility) — nothing is compatible by default, so a major bump
      does not need a separate "breaking" flag to stop old installs from
      silently picking it up.
    required: false
    default: auto
phases:
  preview:
    label: Preview
    description: Compute the release plan (no side effects)
  checks:
    label: Checks
    description: Run configured pre-release checks
  approval:
    label: Approval
    description: Human sign-off after the complete release review package is ready
  prepare:
    label: Prepare
    description: Update package versions after approval
  git:
    label: Git
    description: Commit, tag, and push the prepared release

jobs:
  prepare:
    runsOn: local
    steps:
      - name: Verify release branch
        id: branch
        phase: preview
        run: |
          set -e
          branch="$(git branch --show-current)"
          if [ "$branch" != "master" ]; then
            echo "Release preparation is allowed only from master (current branch: ${branch:-detached})" >&2
            exit 1
          fi

      - name: Preview
        id: plan
        phase: preview
        timeoutMs: 1200000
        run: pnpm kb release plan --flow ${{ inputs.flow }} --channel ${{ inputs.channel }} --bump ${{ inputs.bump }}

      - name: Checks
        id: checks
        phase: checks
        # pack-install runs a real `npm pack` + clean-consumer `npm install` per package
        # (~140 packages). At the process-broker's safe concurrency (CHECKS_CONCURRENCY=2,
        # see plugins/release/manager-core/src/checks.ts) a full run is install-heavy and
        # can grow with the monorepo; keep a two-hour budget for future package growth.
        timeoutMs: 7200000
        if: ${{ !inputs.skipChecks }}
        run: pnpm kb release checks --flow ${{ inputs.flow }} --json

      - name: Prepare release review
        id: review
        phase: approval
        timeoutMs: 1200000
        env:
          RELEASE_FLOW: "${{ inputs.flow }}"
          RELEASE_PLAN_PATH: "${{ steps.plan.outputs.planPath }}"
        artifacts:
          releaseReview:
            type: markdown
            source: steps.review.outputs.review
            label: Release review
            showInSummary: true
          releasePlan:
            type: json
            source: steps.review.outputs.plan
            label: Release plan
            showInSummary: true
          releaseChangelog:
            type: markdown
            source: steps.review.outputs.changelog
            label: Changelog
            showInSummary: true
          releaseCompare:
            type: link
            source: steps.review.outputs.compareUrl
            label: Changes since previous release
            showInSummary: true
          releaseTag:
            type: link
            source: steps.review.outputs.tagUrl
            label: Release tag
            showInSummary: true
        run: |
          set -e
          if [ "${{ inputs.channel }}" = "stable" ]; then
            pnpm kb release changelog --flow ${{ inputs.flow }}
          fi
          RELEASE_CHANNEL="${{ inputs.channel }}" node .kb/workflows/scripts/release-review-artifacts.mjs

      - name: Confirm release
        phase: approval
        uses: builtin:approval
        with:
          title: "Release ${{ inputs.flow }} (${{ inputs.channel }}) — proceed?"
          instructions: "Review the release plan, package links, and check results above — including the 'Current release status' section, which shows whether the last stable tag and npm already agree before this candidate. A warning there is not this candidate's fault, but it means the baseline you're releasing on top of is not fully clean — read it before treating this as a routine approve. Approval only prepares the Git state (for stable) and starts the governed release-plugin build in immutable candidate CI. Publishing and the installable channel are separate later transitions, and the channel moves only after green smoke. bump=${{ inputs.bump }} (verify the plan's version numbers match what you expect — 'major' does not add a compatibility gate on top of the version bump; the release-index compatibility matrix already relates versions by exact explicit pairs). skipChecks=${{ inputs.skipChecks }} (if true, pack-install/typecheck/lint/tests did NOT run — verify manually before approving)."

      - name: Bump versions
        id: version
        phase: prepare
        if: ${{ inputs.channel == 'stable' }}
        timeoutMs: 1200000
        run: pnpm kb release version --flow ${{ inputs.flow }} --bump ${{ inputs.bump }} --json

      - name: Verify release branch before git operations
        id: git-branch
        phase: git
        if: ${{ inputs.channel == 'stable' }}
        run: |
          set -e
          branch="$(git branch --show-current)"
          if [ "$branch" != "master" ]; then
            echo "Refusing to create release commit or tag outside master (current branch: ${branch:-detached})" >&2
            exit 1
          fi

      - name: Commit and tag
        id: git
        phase: git
        if: ${{ inputs.channel == 'stable' }}
        timeoutMs: 1200000
        run: pnpm kb release git --flow ${{ inputs.flow }} --bump ${{ inputs.bump }} --json

      - name: Build immutable candidate in controlled CI
        id: candidate
        phase: git
        timeoutMs: 7200000
        run: |
          set -euo pipefail
          version='${{ steps.plan.outputs.version }}'
          test -n "$version"
          commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short=12 HEAD)"
          candidate_id="${{ inputs.flow }}-${version}-${{ inputs.channel }}-${short_commit}"
          node .kb/workflows/scripts/dispatch-release-candidate.mjs \
            --candidate-id "$candidate_id" \
            --commit "$commit" \
            --flow '${{ inputs.flow }}' \
            --version "$version" \
            --channel '${{ inputs.channel }}' \
            --repository "${GITHUB_REPOSITORY:-kb-labs-team/kb-labs}"
