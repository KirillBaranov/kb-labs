# Local release "prepare" step — checks, build, review artifacts, version bump, git
# commit/tag/push, gated on a human sign-off after seeing the plan. Runs
# only on the developer's own machine (kb-dev start must be up), never in
# CI — see plugins/release/docs/adr/0001-* and the release plan.
#
# Deliberately a thin wrapper around the existing, already-tested atomic
# release commands — no release logic is reimplemented here.
#
# Run: kb workflow:run --workflow-id workspace:release-prepare --input '{"flow":"platform"}'

name: release-prepare
version: 1.0.0
description: Prepare a release (version, changelog, git tag/push) with a human approval gate — never publishes to npm.
on:
  manual: true

inputs:
  flow:
    type: string
    description: Release flow to prepare — must match a key under release.flows in .kb/kb.config.json (e.g. "platform", "sdk")
    required: true

phases:
  preview:
    label: Preview
    description: Compute the release plan (no side effects)
  checks:
    label: Checks
    description: Run configured pre-release checks
  build:
    label: Build
    description: Build packages included in the release
  approval:
    label: Approval
    description: Human sign-off after the complete release review package is ready
  prepare:
    label: Prepare
    description: Update package versions after approval
  git:
    label: Git
    description: Commit, tag, and push the prepared release

jobs:
  prepare:
    runsOn: local
    steps:
      - name: Verify release branch
        id: branch
        phase: preview
        run: |
          set -e
          branch="$(git branch --show-current)"
          if [ "$branch" != "main" ]; then
            echo "Release preparation is allowed only from main (current branch: ${branch:-detached})" >&2
            exit 1
          fi

      - name: Preview
        id: plan
        phase: preview
        timeoutMs: 1200000
        run: pnpm kb release plan --flow ${{ inputs.flow }}

      - name: Checks
        id: checks
        phase: checks
        timeoutMs: 1200000
        run: pnpm kb release checks --flow ${{ inputs.flow }} --json

      - name: Build
        id: build
        phase: build
        timeoutMs: 1200000
        run: pnpm kb release build --flow ${{ inputs.flow }} --json

      - name: Prepare release review
        id: review
        phase: approval
        timeoutMs: 1200000
        env:
          RELEASE_FLOW: "${{ inputs.flow }}"
          RELEASE_PLAN_PATH: "${{ steps.plan.outputs.planPath }}"
        artifacts:
          releaseReview:
            type: markdown
            source: steps.review.outputs.review
            label: Release review
            showInSummary: true
          releasePlan:
            type: json
            source: steps.review.outputs.plan
            label: Release plan
            showInSummary: true
          releaseChangelog:
            type: markdown
            source: steps.review.outputs.changelog
            label: Changelog
            showInSummary: true
          releaseCompare:
            type: link
            source: steps.review.outputs.compareUrl
            label: Changes since previous release
            showInSummary: true
          releaseTag:
            type: link
            source: steps.review.outputs.tagUrl
            label: Release tag
            showInSummary: true
        run: |
          set -e
          pnpm kb release changelog --flow ${{ inputs.flow }}
          node .kb/workflows/scripts/release-review-artifacts.mjs

      - name: Confirm release
        phase: approval
        uses: builtin:approval
        with:
          title: "Release ${{ inputs.flow }} — proceed?"
          instructions: Review the release plan, generated changelog, package links, comparison link, and check/build results above. Approve only if this exact release should be versioned, tagged, and pushed. Nothing is published to npm here — that happens in CI, triggered by the tag pushed at the end.

      - name: Bump versions
        id: version
        phase: prepare
        timeoutMs: 1200000
        run: pnpm kb release version --flow ${{ inputs.flow }} --json

      - name: Verify release branch before git operations
        id: git-branch
        phase: git
        run: |
          set -e
          branch="$(git branch --show-current)"
          if [ "$branch" != "main" ]; then
            echo "Refusing to create release commit or tag outside main (current branch: ${branch:-detached})" >&2
            exit 1
          fi

      - name: Commit and tag
        id: git
        phase: git
        timeoutMs: 1200000
        run: pnpm kb release git --flow ${{ inputs.flow }} --bump auto --json
