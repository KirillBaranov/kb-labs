name: github-issue-to-pr
version: 6.7.0
description: 'Issue → Plan → Approve (corrections) → Implement → Validate → CI Loop → Final Approve (corrections) → PR'

on:
  manual: true

inputs:
  owner:
    type: string
    description: 'GitHub repo owner'
    required: true
  repo:
    type: string
    description: 'GitHub repo name'
    required: true
  issueNumber:
    type: number
    description: 'GitHub issue number'
    required: true
  baseBranch:
    type: string
    description: 'Base branch'
    default: main

jobs:
  issue-to-pr:
    runsOn: local
    steps:

      # ── 1. Fetch Issue ───────────────────────────────────────────────────────
      - name: Fetch Issue
        id: issue
        uses: 'plugin:@kb-labs/github/fetch-issue'
        with:
          owner: '${{ inputs.owner }}'
          repo: '${{ inputs.repo }}'
          issueNumber: '${{ inputs.issueNumber }}'
        artifacts:
          issueLink:
            type: link
            source: outputs.url
            label: 'GitHub Issue'
            showInSummary: true

      # ── 2. Create Feature Branch ─────────────────────────────────────────────
      - name: Create Branch
        id: branch
        uses: 'plugin:@kb-labs/github/create-branch'
        with:
          owner: '${{ inputs.owner }}'
          repo: '${{ inputs.repo }}'
          branchName: 'issue-${{ inputs.issueNumber }}-auto'
          fromBranch: '${{ inputs.baseBranch }}'

      # ── 3. Agent: Plan ───────────────────────────────────────────────────────
      - name: Agent Plans
        id: plan
        timeoutMs: 3600000
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
          ISSUE_BODY: '${{ steps.issue.outputs.body }}'
          PLAN_FEEDBACK: '${{ trigger.payload.planFeedback }}'
        artifacts:
          agentPlan:
            type: markdown
            source: outputs.plan
            label: Implementation Plan
            showInSummary: true
        run: bash .kb/workflows/scripts/agent-plans.sh

      # ── 4. Open Draft PR with Plan ───────────────────────────────────────────
      - name: Open Draft PR with Plan
        id: pr
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          BASE_BRANCH: '${{ inputs.baseBranch }}'
          BRANCH_NAME: '${{ steps.branch.outputs.branchName }}'
        artifacts:
          prLink:
            type: link
            source: outputs.prUrl
            label: 'Draft PR'
            showInSummary: true
        run: bash .kb/workflows/scripts/open-draft-pr.sh

      # ── 5. Approval Gate: Review Plan ────────────────────────────────────────
      - name: Approve Plan
        id: planApproval
        uses: builtin:approval
        with:
          message: |
            Plan ready. Approve to implement, or reject with corrections for the agent to replan.

            Issue: #${{ inputs.issueNumber }} — ${{ steps.issue.outputs.title }}
            Draft PR: ${{ steps.pr.outputs.prUrl }}

      # ── 6. Plan Gate: continue or replan with feedback ────────────────────────
      - name: Plan Gate
        uses: builtin:gate
        with:
          decision: ${{ steps.planApproval.outputs.action }}
          routes:
            approve: continue
            reject:
              restartFrom: plan
              context:
                planFeedback: ${{ steps.planApproval.outputs.comment }}
          maxIterations: 5

      # ── 7. Agent: Implement ──────────────────────────────────────────────────
      - name: Agent Implements
        id: impl
        timeoutMs: 3600000
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
          PLAN_SESSION_ID: '${{ steps.plan.outputs.sessionId }}'
          IMPL_FEEDBACK: '${{ trigger.payload.implFeedback }}'
        artifacts:
          implSummary:
            type: markdown
            source: outputs.summary
            label: Implementation Summary
            showInSummary: true
        run: bash .kb/workflows/scripts/agent-implements.sh

      # ── 7b. Post Implementation Summary ─────────────────────────────────────
      - name: Post Implementation Summary
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          PR_NUMBER: '${{ steps.pr.outputs.prNumber }}'
          IMPL_SUMMARY: '${{ steps.impl.outputs.summary }}'
        run: bash .kb/workflows/scripts/post-impl-summary.sh

      # ── 8. AI Review ─────────────────────────────────────────────────────────
      - name: AI Review
        id: review
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
        artifacts:
          reviewSummary:
            type: markdown
            source: outputs.summary
            label: Code Review
            showInSummary: true
        run: bash .kb/workflows/scripts/ai-review.sh

      # ── 8b. Agent: Fix Review Blockers ───────────────────────────────────────
      - name: Agent Fixes Review
        id: review_fix
        timeoutMs: 3600000
        if: ${{ steps.review.outputs.passed == 'false' }}
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
          REVIEW_ISSUES: '${{ steps.review.outputs.issues }}'
          IMPL_SESSION_ID: '${{ steps.impl.outputs.sessionId }}'
        run: bash .kb/workflows/scripts/agent-fixes-review.sh

      # ── 8c. Architect Review ─────────────────────────────────────────────────
      - name: Architect Review
        id: architect
        timeoutMs: 180000
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
        artifacts:
          architectReview:
            type: markdown
            source: outputs.review
            label: Architect Review
            showInSummary: true
        run: bash .kb/workflows/scripts/architect-review.sh

      # ── 8d. Agent: Fix Architect Blockers ────────────────────────────────────
      - name: Agent Fixes Architect Blockers
        id: architect_fix
        timeoutMs: 3600000
        if: ${{ steps.architect.outputs.verdict == 'NEEDS_FIXES' && steps.architect.outputs.blockers_count != '0' }}
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
          ARCHITECT_REVIEW: '${{ steps.architect.outputs.review }}'
          IMPL_SESSION_ID: '${{ steps.impl.outputs.sessionId }}'
        run: bash .kb/workflows/scripts/agent-fixes-architect.sh

      # ── 8d2. Post Architect Fix ──────────────────────────────────────────────
      - name: Post Architect Fix
        if: ${{ steps.architect.outputs.verdict == 'NEEDS_FIXES' && steps.architect.outputs.blockers_count != '0' }}
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          PR_NUMBER: '${{ steps.pr.outputs.prNumber }}'
          ARCHITECT_FIX_SUMMARY: '${{ steps.architect_fix.outputs.summary }}'
        run: bash .kb/workflows/scripts/post-architect-fix.sh

      # ── 8e. Adversarial QA ───────────────────────────────────────────────────
      - name: Adversarial QA
        id: qa_adversarial
        timeoutMs: 3600000
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
        artifacts:
          qaReport:
            type: markdown
            source: outputs.report
            label: Adversarial QA Report
            showInSummary: true
        run: bash .kb/workflows/scripts/adversarial-qa.sh

      # ── 8f. Agent: Fix QA Bugs ────────────────────────────────────────────────
      - name: Agent Fixes QA Bugs
        id: qa_fix
        timeoutMs: 3600000
        if: ${{ steps.qa_adversarial.outputs.verdict == 'BUGS_FOUND' }}
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
          QA_REPORT: '${{ steps.qa_adversarial.outputs.report }}'
          IMPL_SESSION_ID: '${{ steps.impl.outputs.sessionId }}'
        run: bash .kb/workflows/scripts/agent-fixes-qa.sh

      # ── 8f2. Post QA Fix ─────────────────────────────────────────────────────
      - name: Post QA Fix
        if: ${{ steps.qa_adversarial.outputs.verdict == 'BUGS_FOUND' }}
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          PR_NUMBER: '${{ steps.pr.outputs.prNumber }}'
          QA_FIX_SUMMARY: '${{ steps.qa_fix.outputs.summary }}'
        run: bash .kb/workflows/scripts/post-qa-fix.sh

      # ── 8g. Post Architect Review to PR ─────────────────────────────────────
      - name: Post Architect Review
        id: post_architect
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          PR_NUMBER: '${{ steps.pr.outputs.prNumber }}'
          ARCHITECT_VERDICT: '${{ steps.architect.outputs.verdict }}'
        run: bash .kb/workflows/scripts/post-architect-review.sh

      # ── 8h. Post Adversarial QA Report to PR ────────────────────────────────
      - name: Post QA Report
        id: post_qa
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          PR_NUMBER: '${{ steps.pr.outputs.prNumber }}'
          QA_VERDICT: '${{ steps.qa_adversarial.outputs.verdict }}'
        run: bash .kb/workflows/scripts/post-qa-report.sh

      # ── 9. QA Checks (diff-aware, fast, local) ───────────────────────────────
      - name: QA Checks
        id: checks
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          BASE_BRANCH: '${{ inputs.baseBranch }}'
        run: bash .kb/workflows/scripts/qa-checks.sh

      # ── 10. Commit & Push ────────────────────────────────────────────────────
      - name: Commit and Push
        id: commit
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
          BRANCH_NAME: '${{ steps.branch.outputs.branchName }}'
          IMPL_FEEDBACK: '${{ trigger.payload.implFeedback }}'
        run: bash .kb/workflows/scripts/commit-push.sh

      # ── 11. Agent: Fix CI failures ───────────────────────────────────────────
      - name: Agent Fixes CI
        id: ci_fix
        timeoutMs: 3600000
        if: ${{ trigger.payload.hasLogs == true || trigger.payload.hasLogs == 'true' }}
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          BRANCH_NAME: '${{ steps.branch.outputs.branchName }}'
          IMPL_SESSION_ID: '${{ steps.impl.outputs.sessionId }}'
          CI_LOGS_FILE: '${{ trigger.payload.ciLogsFile }}'
        run: bash .kb/workflows/scripts/agent-fixes-ci.sh

      # ── 12. Check CI ─────────────────────────────────────────────────────────
      - name: Check CI
        id: ci_wait
        timeoutMs: 3600000
        env:
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          PR_NUMBER: '${{ steps.pr.outputs.prNumber }}'
          BRANCH_NAME: '${{ steps.branch.outputs.branchName }}'
        run: bash .kb/workflows/scripts/check-ci.sh

      # ── 13. CI Gate: pass, wait more, or fix ────────────────────────────────
      - name: CI Gate
        uses: builtin:gate
        with:
          decision: ${{ steps.ci_wait.outputs.decision }}
          routes:
            passed: continue
            pending:
              restartFrom: ci_wait
              context:
                hasLogs: false
                ciLogsFile: ''
            fix_needed:
              restartFrom: ci_fix
              context:
                hasLogs: ${{ steps.ci_wait.outputs.hasLogs }}
                ciLogsFile: ${{ steps.ci_wait.outputs.ciLogsFile }}
          default: fail
          maxIterations: 240

      # ── 14. Mark PR Ready ────────────────────────────────────────────────────
      - name: Mark PR Ready
        env:
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          PR_NUMBER: '${{ steps.pr.outputs.prNumber }}'
        run: |
          gh pr ready "$PR_NUMBER" --repo "$OWNER/$REPO" 2>/dev/null || true

      # ── 15. Update PR Description ────────────────────────────────────────────
      - name: Update PR Description
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          PR_NUMBER: '${{ steps.pr.outputs.prNumber }}'
        run: bash .kb/workflows/scripts/update-pr-description.sh

      # ── 16. Final Approval ────────────────────────────────────────────────────
      - name: Final Approval
        id: finalApproval
        uses: builtin:approval
        with:
          message: |
            Implementation complete. CI passed.

            PR: ${{ steps.pr.outputs.prUrl }}

            Approve to finish, or reject with corrections for the agent to fix.

      # ── 17. Final Gate: finish or loop back to implement ────────────────────
      - name: Final Gate
        uses: builtin:gate
        with:
          decision: ${{ steps.finalApproval.outputs.action }}
          routes:
            approve: continue
            reject:
              restartFrom: impl
              context:
                implFeedback: ${{ steps.finalApproval.outputs.comment }}
          default: fail
          maxIterations: 10

      # ── 17b. Post Pipeline Summary ───────────────────────────────────────────
      - name: Post Pipeline Summary
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          PR_NUMBER: '${{ steps.pr.outputs.prNumber }}'
          BRANCH_NAME: '${{ steps.branch.outputs.branchName }}'
          REVIEW_PASSED: '${{ steps.review.outputs.passed }}'
          ARCHITECT_VERDICT: '${{ steps.architect.outputs.verdict }}'
          QA_VERDICT: '${{ steps.qa_adversarial.outputs.verdict }}'
          QA_BUGS_COUNT: '${{ steps.qa_adversarial.outputs.bugs_count }}'
          CHECKS_STATUS: '${{ steps.checks.outputs.status }}'
        run: bash .kb/workflows/scripts/post-pipeline-summary.sh

      # ── 18. Comment on Issue ─────────────────────────────────────────────────
      - name: Comment on Issue
        id: comment
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          QA_STATUS: '${{ steps.checks.outputs.status }}'
        run: bash .kb/workflows/scripts/comment-on-issue.sh

      # ── 19. Merge PR ─────────────────────────────────────────────────────────
      - name: Merge PR
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          ISSUE_TITLE: '${{ steps.issue.outputs.title }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
          PR_NUMBER: '${{ steps.pr.outputs.prNumber }}'
        run: bash .kb/workflows/scripts/merge-pr.sh

      # ── 20. Close Issue ───────────────────────────────────────────────────────
      - name: Close Issue
        env:
          ISSUE_NUMBER: '${{ inputs.issueNumber }}'
          OWNER: '${{ inputs.owner }}'
          REPO: '${{ inputs.repo }}'
        run: bash .kb/workflows/scripts/close-issue.sh
